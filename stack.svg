<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="voidBg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070D"/>
      <stop offset="50%" stop-color="#0B0E1B"/>
      <stop offset="100%" stop-color="#040509"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="purpleBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#A855F7" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Hollow Purple Obliteration Beam -->
    <linearGradient id="purpleBlast" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0.95"/>
      <stop offset="20%" stop-color="#7C3AED" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#A855F7" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="purpleCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#C084FC"/>
      <stop offset="70%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>

    <filter id="purpleGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      @keyframes beamPulsing {
        0%, 100% { opacity: 0.6; transform: scaleY(1); }
        50% { opacity: 0.95; transform: scaleY(1.08); }
      }
      @keyframes gojoHover {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-5px); }
      }
      .beam { transform-origin: 285px 205px; animation: beamPulsing 3s ease-in-out infinite; }
      .gojoFloat { animation: gojoHover 4s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Card Surface -->
  <rect x="2" y="2" width="936" height="376" rx="26" fill="url(#voidBg2)" stroke="url(#purpleBorder)" stroke-width="2"/>

  <!-- ================= HOLLOW PURPLE BEAM (Cone Light Projector) ================= -->
  <path d="M 285 200 L 890 80 L 910 340 L 285 210 Z" fill="url(#purpleBlast)" class="beam" pointer-events="none"/>

  <!-- ================= LEFT: GOJO FIRING HOLLOW PURPLE ================= -->
  <g class="gojoFloat">
    <!-- Cursed Energy Aura Field -->
    <circle cx="150" cy="190" r="110" fill="#7C3AED" opacity="0.12"/>
    <circle cx="150" cy="190" r="80" fill="#00F0FF" opacity="0.08"/>

    <!-- High Collar Dark Uniform -->
    <path d="M 90 220 Q 155 175 220 215 L 240 365 Q 160 375 80 365 Z" fill="#090E1D" stroke="#1E2A4A" stroke-width="1.6"/>
    <!-- Collar -->
    <path d="M 120 220 L 155 240 L 190 220 L 180 205 L 130 205 Z" fill="#1E1B4B"/>

    <!-- Snow White Spiky Hair -->
    <path d="M 115 130 Q 120 85 138 65 Q 148 95 158 55 Q 168 95 178 62 Q 195 85 200 130 Q 185 118 175 125 Q 155 110 135 125 Z" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
    
    <!-- Face -->
    <path d="M 132 135 Q 158 172 184 135 Q 175 115 140 115 Z" fill="#FED7AA"/>

    <!-- Black Blindfold with Cyan Six Eyes Emission -->
    <rect x="126" y="128" width="62" height="18" rx="5" fill="#050811" stroke="#00F0FF" stroke-width="1"/>
    <!-- Six Eyes Glimmer -->
    <circle cx="145" cy="137" r="3" fill="#00F0FF"/>
    <circle cx="145" cy="137" r="1.2" fill="#FFFFFF"/>
    <circle cx="170" cy="137" r="3" fill="#00F0FF"/>
    <circle cx="170" cy="137" r="1.2" fill="#FFFFFF"/>

    <!-- Hands Channelling Blue & Red to form Hollow Purple -->
    <!-- Left Hand: Lapse Blue -->
    <circle cx="215" cy="175" r="7" fill="#00F0FF" opacity="0.8"/>
    <!-- Right Hand: Reversal Red -->
    <circle cx="215" cy="235" r="7" fill="#EF4444" opacity="0.8"/>
    <!-- Collision point: Hollow Purple Singularity -->
    <g filter="url(#purpleGlow)">
      <circle cx="285" cy="205" r="24" fill="url(#purpleCore)"/>
      <circle cx="285" cy="205" r="9" fill="#FFFFFF"/>
    </g>

    <!-- Concentric Infinity Rings at impact -->
    <circle cx="285" cy="205" r="34" fill="none" stroke="#C084FC" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.9"/>
    <circle cx="285" cy="205" r="48" fill="none" stroke="#00F0FF" stroke-width="1" stroke-dasharray="6 4" opacity="0.6"/>
  </g>

  <!-- ================= RIGHT: TECH STACK PILLS ================= -->
  <g transform="translate(355, 36)">
    
    <!-- Header -->
    <g>
      <text x="0" y="22" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#00F0FF" letter-spacing="3">// CURSED TECHNIQUE ARSENAL</text>
      <text x="545" y="22" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="600" fill="#C084FC" text-anchor="end" letter-spacing="1">15+ SPECIAL GRADE TOOLS</text>
      <text x="0" y="58" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">Tools I dominate with</text>
    </g>

    <!-- ROW 1: CORE JUJUTSU (Languages) -->
    <g transform="translate(0, 84)">
      <!-- HTML5 -->
      <g transform="translate(0, 0)">
        <rect width="102" height="42" rx="10" fill="#0F1424" stroke="#E34F26" stroke-width="1" stroke-opacity="0.6"/>
        <circle cx="22" cy="21" r="11" fill="#E34F26" fill-opacity="0.15"/>
        <text x="22" y="25" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#E34F26" text-anchor="middle">5</text>
        <text x="44" y="26" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#F8FAFC">HTML5</text>
      </g>
      <!-- CSS3 -->
      <g transform="translate(110, 0)">
        <rect width="102" height="42" rx="10" fill="#0F1424" stroke="#1572B6" stroke-width="1" stroke-opacity="0.6"/>
        <circle cx="22" cy="21" r="11" fill="#1572B6" fill-opacity="0.15"/>
        <text x="22" y="25" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#38BDF8" text-anchor="middle">#</text>
        <text x="44" y="26" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#F8FAFC">CSS3</text>
      </g>
      <!-- JavaScript -->
      <g transform="translate(220, 0)">
        <rect width="112" height="42" rx="10" fill="#0F1424" stroke="#F7DF1E" stroke-width="1" stroke-opacity="0.6"/>
        <circle cx="22" cy="21" r="11" fill="#F7DF1E" fill-opacity="0.15"/>
        <text x="22" y="25" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#FACC15" text-anchor="middle">JS</text>
        <text x="43" y="26" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#F8FAFC">JavaScript</text>
      </g>
      <!-- TypeScript -->
      <g transform="translate(340, 0)">
        <rect width="112" height="42" rx="10" fill="#0F1424" stroke="#3178C6" stroke-width="1" stroke-opacity="0.7"/>
        <circle cx="22" cy="21" r="11" fill="#3178C6" fill-opacity="0.15"/>
        <text x="22" y="25" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#60A5FA" text-anchor="middle">TS</text>
        <text x="43" y="26" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#F8FAFC">TypeScript</text>
      </g>
      <!-- Python -->
      <g transform="translate(460, 0)">
        <rect width="85" height="42" rx="10" fill="#0F1424" stroke="#00F0FF" stroke-width="1" stroke-opacity="0.8"/>
        <circle cx="20" cy="21" r="11" fill="#00F0FF" fill-opacity="0.15"/>
        <text x="20" y="25" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" fill="#00F0FF" text-anchor="middle">Py</text>
        <text x="38" y="26" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#F8FAFC">Python</text>
      </g>
    </g>

    <!-- ROW 2: FRAMEWORKS & ENGINES -->
    <g transform="translate(0, 142)">
      <!-- React -->
      <g transform="translate(0, 0)">
        <rect width="102" height="42" rx="10" fill="#0F1424" stroke="#61DAFB" stroke-width="1.2" stroke-opacity="0.8"/>
        <circle cx="22" cy="21" r="11" fill="#61DAFB" fill-opacity="0.15"/>
        <text x="22" y="25" font-family="'Inter', sans-serif" font-size="13" fill="#61DAFB" text-anchor="middle">⚛</text>
        <text x="44" y="26" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#F8FAFC">React</text>
      </g>
      <!-- Next.js -->
      <g transform="translate(110, 0)">
        <rect width="102" height="42" rx="10" fill="#0F1424" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.6"/>
        <circle cx="22" cy="21" r="11" fill="#FFFFFF" fill-opacity="0.12"/>
        <text x="22" y="25" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">N</text>
        <text x="44" y="26" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#F8FAFC">Next.js</text>
      </g>
      <!-- Tailwind CSS -->
      <g transform="translate(220, 0)">
        <rect width="112" height="42" rx="10" fill="#0F1424" stroke="#00F0FF" stroke-width="1" stroke-opacity="0.7"/>
        <circle cx="22" cy="21" r="11" fill="#00F0FF" fill-opacity="0.15"/>
        <text x="22" y="25" font-family="'Inter', sans-serif" font-size="12" fill="#00F0FF" text-anchor="middle">≋</text>
        <text x="43" y="26" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#F8FAFC">Tailwind</text>
      </g>
      <!-- FastAPI -->
      <g transform="translate(340, 0)">
        <rect width="112" height="42" rx="10" fill="#0F1424" stroke="#10B981" stroke-width="1" stroke-opacity="0.7"/>
        <circle cx="22" cy="21" r="11" fill="#10B981" fill-opacity="0.15"/>
        <text x="22" y="25" font-family="'Inter', sans-serif" font-size="12" fill="#34D399" text-anchor="middle">⚡</text>
        <text x="43" y="26" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#F8FAFC">FastAPI</text>
      </g>
      <!-- Node.js -->
      <g transform="translate(460, 0)">
        <rect width="85" height="42" rx="10" fill="#0F1424" stroke="#22C55E" stroke-width="1" stroke-opacity="0.6"/>
        <circle cx="20" cy="21" r="11" fill="#22C55E" fill-opacity="0.15"/>
        <text x="20" y="25" font-family="'Inter', sans-serif" font-size="11" fill="#4ADE80" text-anchor="middle">⬢</text>
        <text x="38" y="26" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#F8FAFC">Node.js</text>
      </g>
    </g>

    <!-- ROW 3: ARTIFACTS & SPECIAL GRADE TOOLS -->
    <g transform="translate(0, 200)">
      <!-- PostgreSQL -->
      <g transform="translate(0, 0)">
        <rect width="102" height="42" rx="10" fill="#0F1424" stroke="#336791" stroke-width="1" stroke-opacity="0.7"/>
        <circle cx="22" cy="21" r="11" fill="#336791" fill-opacity="0.15"/>
        <text x="22" y="25" font-family="'Inter', sans-serif" font-size="11" fill="#60A5FA" text-anchor="middle">🐘</text>
        <text x="43" y="26" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#F8FAFC">Postgres</text>
      </g>
      <!-- Docker -->
      <g transform="translate(110, 0)">
        <rect width="102" height="42" rx="10" fill="#0F1424" stroke="#2496ED" stroke-width="1" stroke-opacity="0.6"/>
        <circle cx="22" cy="21" r="11" fill="#2496ED" fill-opacity="0.15"/>
        <text x="22" y="25" font-family="'Inter', sans-serif" font-size="12" fill="#38BDF8" text-anchor="middle">🐋</text>
        <text x="44" y="26" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#F8FAFC">Docker</text>
      </g>
      <!-- Git & GitHub -->
      <g transform="translate(220, 0)">
        <rect width="112" height="42" rx="10" fill="#0F1424" stroke="#EF4444" stroke-width="1" stroke-opacity="0.6"/>
        <circle cx="22" cy="21" r="11" fill="#EF4444" fill-opacity="0.15"/>
        <text x="22" y="25" font-family="'Inter', sans-serif" font-size="12" fill="#F87171" text-anchor="middle">⌥</text>
        <text x="43" y="26" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#F8FAFC">Git / Hub</text>
      </g>
      <!-- Framer Motion -->
      <g transform="translate(340, 0)">
        <rect width="112" height="42" rx="10" fill="#0F1424" stroke="#A855F7" stroke-width="1" stroke-opacity="0.8"/>
        <circle cx="22" cy="21" r="11" fill="#A855F7" fill-opacity="0.15"/>
        <text x="22" y="25" font-family="'Inter', sans-serif" font-size="12" fill="#C084FC" text-anchor="middle">▲</text>
        <text x="43" y="26" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#F8FAFC">Framer</text>
      </g>
      <!-- Vite -->
      <g transform="translate(460, 0)">
        <rect width="85" height="42" rx="10" fill="#0F1424" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.6"/>
        <circle cx="20" cy="21" r="11" fill="#F59E0B" fill-opacity="0.15"/>
        <text x="20" y="25" font-family="'Inter', sans-serif" font-size="11" fill="#FBBF24" text-anchor="middle">⚡</text>
        <text x="38" y="26" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#F8FAFC">Vite</text>
      </g>
    </g>

    <!-- Bottom Status Pill -->
    <g transform="translate(0, 264)">
      <rect x="0" y="0" width="545" height="40" rx="12" fill="#0B0F1C" stroke="#1E2A4A" stroke-width="1"/>
      <circle cx="18" cy="20" r="4" fill="#00F0FF"/>
      <text x="30" y="24" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94A3B8">Every cursed tool weaponized for Special Grade zero-latency velocity.</text>
    </g>

  </g>
</svg>
