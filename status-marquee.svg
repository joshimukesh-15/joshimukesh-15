<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 44" width="940" height="44">
  <defs>
    <linearGradient id="navBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#080C16"/>
      <stop offset="50%" stop-color="#0E1626"/>
      <stop offset="100%" stop-color="#080C16"/>
    </linearGradient>
    <linearGradient id="navBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.3"/>
    </linearGradient>
    <style>
      @keyframes pulseNode {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.35; transform: scale(1.3); }
      }
      .node-pulse { transform-origin: 22px 22px; animation: pulseNode 2.2s ease-in-out infinite; }
    </style>
  </defs>

  <rect x="1" y="1" width="938" height="42" rx="21" fill="url(#navBg)"/>
  <rect x="1" y="1" width="938" height="42" rx="21" fill="none" stroke="url(#navBorder)" stroke-width="1.2"/>

  <!-- Left: Live Status -->
  <g transform="translate(22, 0)">
    <circle cx="0" cy="22" r="4" fill="#10B981" class="node-pulse"/>
    <circle cx="0" cy="22" r="8" fill="#10B981" opacity="0.25" class="node-pulse"/>
    <text x="14" y="26" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#34D399" letter-spacing="1">SYSTEMS ACTIVE</text>
  </g>

  <!-- Center: Engineering Focus -->
  <text x="470" y="26" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="600" fill="#CBD5E1" text-anchor="middle" letter-spacing="1">
    FULL-STACK ARCHITECTURE <tspan fill="#F59E0B">•</tspan> FINANCIAL LEDGERS <tspan fill="#818CF8">•</tspan> ZERO-DRIFT CODE
  </text>

  <!-- Right: Location -->
  <g transform="translate(916, 0)">
    <text x="0" y="26" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#F59E0B" text-anchor="end" letter-spacing="1">
      INDIA • UTC+05:30
    </text>
  </g>
</svg>
