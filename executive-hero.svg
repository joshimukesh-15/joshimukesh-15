<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" width="940" height="440">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050711"/>
      <stop offset="50%" stop-color="#090D1E"/>
      <stop offset="100%" stop-color="#04060C"/>
    </linearGradient>

    <!-- Edge Border Gradient -->
    <linearGradient id="bezelBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.8"/>
      <stop offset="35%" stop-color="#6366F1" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#A855F7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Subtle Ambient Glows -->
    <radialGradient id="cyanOrb" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.14"/>
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="purpleOrb" cx="85%" cy="70%" r="55%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.12"/>
      <stop offset="60%" stop-color="#3B82F6" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0B0F1D" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      @keyframes orbitCW {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes orbitCCW {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }
      @keyframes pulseDot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.35; transform: scale(1.3); }
      }
      @keyframes waveScan {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(250%); }
      }
      @keyframes textCycle {
        0%, 30% { opacity: 1; transform: translateY(0); }
        33%, 97% { opacity: 0; transform: translateY(-8px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes blinkCursor {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      .orbit-1 { transform-origin: 105px 120px; animation: orbitCW 24s linear infinite; }
      .orbit-2 { transform-origin: 105px 120px; animation: orbitCCW 18s linear infinite; }
      .beacon-dot { transform-origin: 16px 16px; animation: pulseDot 2.2s ease-in-out infinite; }
      .cursor-blink { animation: blinkCursor 1s step-end infinite; }
    </style>
  </defs>

  <!-- Outer Shell with Double Bezel -->
  <rect x="1" y="1" width="938" height="438" rx="28" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="938" height="438" rx="28" fill="none" stroke="url(#bezelBorder)" stroke-width="1.2"/>
  
  <!-- Subtle Internal Grid Matrix -->
  <g opacity="0.06">
    <line x1="0" y1="80" x2="940" y2="80" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="0" y1="160" x2="940" y2="160" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="0" y1="240" x2="940" y2="240" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="0" y1="320" x2="940" y2="320" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="440" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="670" y1="0" x2="670" y2="440" stroke="#FFFFFF" stroke-width="1"/>
  </g>

  <!-- Ambient Light Orbs -->
  <rect x="0" y="0" width="940" height="440" rx="28" fill="url(#cyanOrb)"/>
  <rect x="0" y="0" width="940" height="440" rx="28" fill="url(#purpleOrb)"/>

  <!-- ================= LEFT IDENTITY COLUMN ================= -->
  <g transform="translate(42, 42)">
    
    <!-- Monogram Emblem with Dynamic Planetary Rings -->
    <g transform="translate(0, 0)">
      <!-- Outer Orbit Ring -->
      <circle class="orbit-1" cx="105" cy="120" r="82" fill="none" stroke="#00F0FF" stroke-width="1" stroke-dasharray="8 12" opacity="0.4"/>
      <!-- Inner Orbit Ring -->
      <circle class="orbit-2" cx="105" cy="120" r="64" fill="none" stroke="#8B5CF6" stroke-width="1.2" stroke-dasharray="14 10" opacity="0.5"/>
      
      <!-- Central Emblem Shield (Double Bezel) -->
      <rect x="63" y="78" width="84" height="84" rx="20" fill="#0C1222" stroke="#1E293B" stroke-width="1.5"/>
      <rect x="67" y="82" width="76" height="76" rx="16" fill="#090E1A" stroke="#00F0FF" stroke-width="1" stroke-opacity="0.3"/>
      
      <!-- Monogram 'MJ' -->
      <text x="105" y="129" font-family="'Plus Jakarta Sans', 'Segoe UI', -apple-system, sans-serif" font-size="30" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">MJ</text>
      
      <!-- Mini Satellite Pulse Nodes -->
      <circle cx="187" cy="120" r="3.5" fill="#00F0FF" filter="url(#softGlow)"/>
      <circle cx="41" cy="120" r="3" fill="#8B5CF6"/>
    </g>

    <!-- Engineer Spec Dossier (Beside Monogram) -->
    <g transform="translate(210, 8)">
      
      <!-- Live Status Pill -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="375" height="30" rx="15" fill="#0E1726" stroke="#1E293B" stroke-width="1"/>
        <g transform="translate(14, 0)">
          <circle cx="0" cy="15" r="4.5" fill="#10B981" class="beacon-dot"/>
          <circle cx="0" cy="15" r="8" fill="#10B981" opacity="0.2" class="beacon-dot"/>
        </g>
        <text x="28" y="19.5" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="10.5" font-weight="700" fill="#34D399" letter-spacing="1.2">SYSTEM ONLINE // FULL-STACK ARCHITECT</text>
      </g>

      <!-- Full Name -->
      <text x="0" y="70" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="34" font-weight="800" fill="#FFFFFF" letter-spacing="-0.8">
        Mukesh Joshi
      </text>

      <!-- Role & Core Focus -->
      <text x="0" y="98" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="16" font-weight="600" fill="#38BDF8" letter-spacing="0.2">
        Full-Stack Systems Engineer &amp; Interactive Web Architect
      </text>

      <!-- Engineering Creed -->
      <text x="0" y="126" font-family="'Inter', 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#94A3B8" letter-spacing="0.1">
        Building high-integrity distributed web software, zero-drift financial ledgers, and kinetic web interfaces.
      </text>

      <!-- Key Identity Metadata Chips -->
      <g transform="translate(0, 150)">
        <rect x="0" y="0" width="135" height="28" rx="8" fill="#131C31" stroke="#1E293B" stroke-width="1"/>
        <text x="14" y="18" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#00F0FF">📍 INDIA (IST)</text>

        <rect x="145" y="0" width="180" height="28" rx="8" fill="#131C31" stroke="#1E293B" stroke-width="1"/>
        <text x="159" y="18" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#A855F7">⚡ 32+ PUBLIC REPOS</text>

        <rect x="335" y="0" width="170" height="28" rx="8" fill="#131C31" stroke="#1E293B" stroke-width="1"/>
        <text x="349" y="18" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#10B981">✨ ZERO-DRIFT CODE</text>
      </g>

    </g>
  </g>

  <!-- ================= 3 ARCHITECTURAL PILLARS (BENTO ROW) ================= -->
  <g transform="translate(42, 260)">
    
    <!-- Pillar 1: Frontend Architecture -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="272" height="138" rx="18" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="1.2"/>
      <rect x="14" y="16" width="36" height="36" rx="10" fill="#00F0FF" fill-opacity="0.1" stroke="#00F0FF" stroke-opacity="0.4"/>
      <!-- Icon: Layers / Screen -->
      <path d="M26 28 L32 24 L44 32 L38 36 Z M26 34 L32 38 L44 30 L38 26 Z" fill="none" stroke="#00F0FF" stroke-width="2" stroke-linejoin="round"/>
      
      <text x="60" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Frontend Systems</text>
      <text x="60" y="46" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#38BDF8">REACT • TS • NEXT • VITE</text>

      <text x="16" y="80" font-family="'Inter', sans-serif" font-size="11.5" font-weight="400" fill="#94A3B8">
        Ultra-responsive, accessible user interfaces built with strict type safety, modular state, and sub-second paint metrics.
      </text>

      <!-- Micro Progress / Health Meter -->
      <rect x="16" y="116" width="240" height="4" rx="2" fill="#1E293B"/>
      <rect x="16" y="116" width="230" height="4" rx="2" fill="#00F0FF"/>
    </g>

    <!-- Pillar 2: Backend & Distributed Engines -->
    <g transform="translate(292, 0)">
      <rect x="0" y="0" width="272" height="138" rx="18" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="1.2"/>
      <rect x="14" y="16" width="36" height="36" rx="10" fill="#8B5CF6" fill-opacity="0.1" stroke="#8B5CF6" stroke-opacity="0.4"/>
      <!-- Icon: Server Node -->
      <rect x="24" y="26" width="16" height="6" rx="2" fill="none" stroke="#8B5CF6" stroke-width="1.8"/>
      <rect x="24" y="36" width="16" height="6" rx="2" fill="none" stroke="#8B5CF6" stroke-width="1.8"/>
      <circle cx="37" cy="29" r="1.5" fill="#8B5CF6"/>
      <circle cx="37" cy="39" r="1.5" fill="#8B5CF6"/>

      <text x="60" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Backend Architecture</text>
      <text x="60" y="46" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#A855F7">PYTHON • FASTAPI • NODE</text>

      <text x="16" y="80" font-family="'Inter', sans-serif" font-size="11.5" font-weight="400" fill="#94A3B8">
        High-throughput asynchronous REST APIs, real-time WebSocket meshes, and transaction-safe data settlement.
      </text>

      <rect x="16" y="116" width="240" height="4" rx="2" fill="#1E293B"/>
      <rect x="16" y="116" width="215" height="4" rx="2" fill="#8B5CF6"/>
    </g>

    <!-- Pillar 3: Data Integrity & Storage Ledgers -->
    <g transform="translate(584, 0)">
      <rect x="0" y="0" width="272" height="138" rx="18" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="1.2"/>
      <rect x="14" y="16" width="36" height="36" rx="10" fill="#10B981" fill-opacity="0.1" stroke="#10B981" stroke-opacity="0.4"/>
      <!-- Icon: Database Cylinder -->
      <ellipse cx="32" cy="28" rx="8" ry="4" fill="none" stroke="#10B981" stroke-width="1.8"/>
      <path d="M24 28 v10 c0 2.2 3.6 4 8 4 s8 -1.8 8 -4 v-10" fill="none" stroke="#10B981" stroke-width="1.8"/>

      <text x="60" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Data &amp; Integrity</text>
      <text x="60" y="46" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#34D399">SQL • POSTGRES • PRISMA</text>

      <text x="16" y="80" font-family="'Inter', sans-serif" font-size="11.5" font-weight="400" fill="#94A3B8">
        Strict double-entry bookkeeping ledgers, relational schemas, automated GST reconciliation, and zero audit drift.
      </text>

      <rect x="16" y="116" width="240" height="4" rx="2" fill="#1E293B"/>
      <rect x="16" y="116" width="225" height="4" rx="2" fill="#10B981"/>
    </g>

  </g>
</svg>
