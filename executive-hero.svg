<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" width="940" height="440">
  <defs>
    <!-- Deep Obsidian Luxury Gradient -->
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070F"/>
      <stop offset="50%" stop-color="#090D1A"/>
      <stop offset="100%" stop-color="#04060C"/>
    </linearGradient>

    <!-- Champagne Gold & Titanium Border -->
    <linearGradient id="heroBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#818CF8" stop-opacity="0.5"/>
      <stop offset="75%" stop-color="#FBBF24" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Warm Ambient Orbs -->
    <radialGradient id="goldOrb" cx="18%" cy="28%" r="55%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.12"/>
      <stop offset="60%" stop-color="#D97706" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="indigoOrb" cx="85%" cy="75%" r="55%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.1"/>
      <stop offset="60%" stop-color="#4F46E5" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Card Backgrounds -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1424" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#080C17" stop-opacity="0.95"/>
    </linearGradient>

    <filter id="glowGold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      @keyframes orbitCW {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes orbitCCW {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }
      @keyframes pulseBeacon {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.35; transform: scale(1.3); }
      }
      .ring-1 { transform-origin: 95px 115px; animation: orbitCW 26s linear infinite; }
      .ring-2 { transform-origin: 95px 115px; animation: orbitCCW 20s linear infinite; }
      .beacon { transform-origin: 14px 14px; animation: pulseBeacon 2.2s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Outer Double Bezel Container -->
  <rect x="1" y="1" width="938" height="438" rx="26" fill="url(#heroBg)"/>
  <rect x="1" y="1" width="938" height="438" rx="26" fill="none" stroke="url(#heroBorder)" stroke-width="1.2"/>

  <!-- Ambient Light Orbs -->
  <rect x="0" y="0" width="940" height="440" rx="26" fill="url(#goldOrb)"/>
  <rect x="0" y="0" width="940" height="440" rx="26" fill="url(#indigoOrb)"/>

  <!-- Subtle Blueprint Grid Lines -->
  <g opacity="0.05">
    <line x1="0" y1="80" x2="940" y2="80" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="0" y1="160" x2="940" y2="160" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="0" y1="245" x2="940" y2="245" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="390" y1="0" x2="390" y2="440" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="660" y1="0" x2="660" y2="440" stroke="#FFFFFF" stroke-width="1"/>
  </g>

  <!-- ================= TOP SECTION: MONOGRAM + IDENTIFIER ================= -->
  <g transform="translate(42, 38)">
    
    <!-- Left: Geometric Monogram Emblem -->
    <g transform="translate(0, 0)">
      <!-- Orbital Ring 1 -->
      <circle class="ring-1" cx="95" cy="115" r="76" fill="none" stroke="#F59E0B" stroke-width="1" stroke-dasharray="8 12" opacity="0.35"/>
      <!-- Orbital Ring 2 -->
      <circle class="ring-2" cx="95" cy="115" r="58" fill="none" stroke="#818CF8" stroke-width="1.2" stroke-dasharray="14 10" opacity="0.4"/>

      <!-- Central Shield (Double Bezel) -->
      <rect x="57" y="77" width="76" height="76" rx="18" fill="#0C1220" stroke="#1E293B" stroke-width="1.5"/>
      <rect x="61" y="81" width="68" height="68" rx="14" fill="#080D18" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.4"/>
      
      <!-- Monogram 'MJ' in Platinum White -->
      <text x="95" y="124" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">MJ</text>
      
      <!-- Satellite Marker -->
      <circle cx="171" cy="115" r="3.5" fill="#F59E0B" filter="url(#glowGold)"/>
      <circle cx="37" cy="115" r="3" fill="#818CF8"/>
    </g>

    <!-- Right: Identity Dossier -->
    <g transform="translate(195, 8)">
      
      <!-- Live Status Pill -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="345" height="28" rx="14" fill="#0D1424" stroke="#1E293B" stroke-width="1"/>
        <g transform="translate(14, 0)">
          <circle cx="0" cy="14" r="4" fill="#10B981" class="beacon"/>
          <circle cx="0" cy="14" r="7.5" fill="#10B981" opacity="0.25" class="beacon"/>
        </g>
        <text x="26" y="18" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#34D399" letter-spacing="1.2">SYSTEM ONLINE // FULL-STACK ARCHITECT</text>
      </g>

      <!-- Full Name -->
      <text x="0" y="66" font-family="'Plus Jakarta Sans', sans-serif" font-size="32" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">
        Mukesh Joshi
      </text>

      <!-- Subtitle Role (Champagne Gold / Platinum) -->
      <text x="0" y="94" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700" fill="#FBBF24" letter-spacing="0.2">
        Systems Architect &amp; Full-Stack Software Engineer
      </text>

      <!-- Concise Description (Properly Wrapped to Prevent ANY Overflow) -->
      <text x="0" y="120" font-family="'Inter', sans-serif" font-size="12.5" font-weight="400" fill="#94A3B8">
        <tspan x="0" dy="0">Architecting high-integrity distributed systems, zero-drift financial ledgers,</tspan>
        <tspan x="0" dy="18">and kinetic, accessible web applications with sub-second paint performance.</tspan>
      </text>

      <!-- Metadata Chips -->
      <g transform="translate(0, 154)">
        <rect x="0" y="0" width="125" height="26" rx="7" fill="#0E1626" stroke="#1E293B" stroke-width="1"/>
        <text x="12" y="17" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="600" fill="#F59E0B">📍 INDIA (IST)</text>

        <rect x="135" y="0" width="180" height="26" rx="7" fill="#0E1626" stroke="#1E293B" stroke-width="1"/>
        <text x="147" y="17" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="600" fill="#818CF8">⚡ 32+ PUBLIC REPOS</text>

        <rect x="325" y="0" width="175" height="26" rx="7" fill="#0E1626" stroke="#1E293B" stroke-width="1"/>
        <text x="337" y="17" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="600" fill="#10B981">✨ ZERO-DRIFT CODE</text>
      </g>

    </g>
  </g>

  <!-- ================= BOTTOM BENTO: 3 PILLARS (NO OVERFLOW) ================= -->
  <g transform="translate(42, 260)">
    
    <!-- Pillar 1: Frontend Architecture -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="272" height="138" rx="16" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.2"/>
      
      <!-- Icon badge -->
      <rect x="16" y="16" width="34" height="34" rx="9" fill="#0284C7" fill-opacity="0.15" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.5"/>
      <path d="M26 27 L33 23 L40 31 L33 35 Z M26 33 L33 37 L40 29 L33 25 Z" fill="none" stroke="#38BDF8" stroke-width="1.8" stroke-linejoin="round"/>

      <text x="58" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="13.5" font-weight="700" fill="#FFFFFF">Frontend Systems</text>
      <text x="58" y="44" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600" fill="#38BDF8">REACT • TS • NEXT • VITE</text>

      <!-- Wrapped Description: Stays 100% within 272px card -->
      <text x="16" y="74" font-family="'Inter', sans-serif" font-size="11" fill="#94A3B8">
        <tspan x="16" dy="0">High-performance user interfaces</tspan>
        <tspan x="16" dy="15">engineered with strict type safety,</tspan>
        <tspan x="16" dy="15">modular state &amp; 60 FPS motion.</tspan>
      </text>

      <!-- Micro Capacity Meter -->
      <rect x="16" y="122" width="240" height="4" rx="2" fill="#1E293B"/>
      <rect x="16" y="122" width="230" height="4" rx="2" fill="#38BDF8"/>
    </g>

    <!-- Pillar 2: Backend & Distributed Services -->
    <g transform="translate(292, 0)">
      <rect x="0" y="0" width="272" height="138" rx="16" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.2"/>
      
      <!-- Icon badge -->
      <rect x="16" y="16" width="34" height="34" rx="9" fill="#7C3AED" fill-opacity="0.15" stroke="#A855F7" stroke-width="1" stroke-opacity="0.5"/>
      <rect x="25" y="25" width="16" height="6" rx="2" fill="none" stroke="#C084FC" stroke-width="1.6"/>
      <rect x="25" y="35" width="16" height="6" rx="2" fill="none" stroke="#C084FC" stroke-width="1.6"/>
      <circle cx="37" cy="28" r="1.2" fill="#C084FC"/>
      <circle cx="37" cy="38" r="1.2" fill="#C084FC"/>

      <text x="58" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="13.5" font-weight="700" fill="#FFFFFF">Backend Architecture</text>
      <text x="58" y="44" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600" fill="#A855F7">PYTHON • FASTAPI • NODE</text>

      <!-- Wrapped Description: Stays 100% within 272px card -->
      <text x="16" y="74" font-family="'Inter', sans-serif" font-size="11" fill="#94A3B8">
        <tspan x="16" dy="0">High-throughput asynchronous APIs,</tspan>
        <tspan x="16" dy="15">real-time WebSocket meshes, and</tspan>
        <tspan x="16" dy="15">transaction-safe microservices.</tspan>
      </text>

      <rect x="16" y="122" width="240" height="4" rx="2" fill="#1E293B"/>
      <rect x="16" y="122" width="218" height="4" rx="2" fill="#A855F7"/>
    </g>

    <!-- Pillar 3: Data Integrity & Storage Ledgers -->
    <g transform="translate(584, 0)">
      <rect x="0" y="0" width="272" height="138" rx="16" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.2"/>
      
      <!-- Icon badge -->
      <rect x="16" y="16" width="34" height="34" rx="9" fill="#D97706" fill-opacity="0.15" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.5"/>
      <ellipse cx="33" cy="27" rx="8" ry="3.5" fill="none" stroke="#FBBF24" stroke-width="1.6"/>
      <path d="M25 27 v10 c0 2 3.6 3.5 8 3.5 s8 -1.5 8 -3.5 v-10" fill="none" stroke="#FBBF24" stroke-width="1.6"/>

      <text x="58" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="13.5" font-weight="700" fill="#FFFFFF">Data &amp; Integrity</text>
      <text x="58" y="44" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600" fill="#FBBF24">SQL • POSTGRES • PRISMA</text>

      <!-- Wrapped Description: Stays 100% within 272px card -->
      <text x="16" y="74" font-family="'Inter', sans-serif" font-size="11" fill="#94A3B8">
        <tspan x="16" dy="0">Zero-drift double-entry ledgers,</tspan>
        <tspan x="16" dy="15">automated GST reconciliation, and</tspan>
        <tspan x="16" dy="15">ACID-compliant relational schemas.</tspan>
      </text>

      <rect x="16" y="122" width="240" height="4" rx="2" fill="#1E293B"/>
      <rect x="16" y="122" width="224" height="4" rx="2" fill="#F59E0B"/>
    </g>

  </g>
</svg>
