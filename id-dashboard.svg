<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" width="940" height="440">
  <defs>
    <linearGradient id="dashBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050711"/>
      <stop offset="50%" stop-color="#090E1F"/>
      <stop offset="100%" stop-color="#04060D"/>
    </linearGradient>

    <linearGradient id="dashBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#818CF8" stop-opacity="0.6"/>
      <stop offset="80%" stop-color="#C084FC" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Badge Lanyard Gradient -->
    <linearGradient id="lanyardStrap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Progress Meter Gradients -->
    <linearGradient id="meterCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#00F0FF"/>
    </linearGradient>
    <linearGradient id="meterPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <linearGradient id="meterEmerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="meterPink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DB2777"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>

    <filter id="badgeShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <style>
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes pulseLive {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.4; }
      }
      .radar-needle { transform-origin: 32px 32px; animation: radarSweep 8s linear infinite; }
      .live-glow { animation: pulseLive 2s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Shell Container -->
  <rect x="1" y="1" width="938" height="438" rx="28" fill="url(#dashBg)"/>
  <rect x="1" y="1" width="938" height="438" rx="28" fill="none" stroke="url(#dashBorder)" stroke-width="1.2"/>

  <!-- ================= LEFT: HARDWARE LANYARD ID BADGE ================= -->
  <g transform="translate(42, 28)">
    
    <!-- Lanyard Webbing Strap -->
    <path d="M125 0 L125 36" stroke="url(#lanyardStrap)" stroke-width="18" stroke-linecap="round"/>
    
    <!-- Metallic Hardware Clip / Swivel -->
    <rect x="114" y="28" width="22" height="14" rx="4" fill="#64748B" stroke="#94A3B8" stroke-width="1"/>
    <circle cx="125" cy="42" r="5" fill="none" stroke="#CBD5E1" stroke-width="2.5"/>

    <!-- ID Card Body (Double Bezel) -->
    <g transform="translate(10, 48)" filter="url(#badgeShadow)">
      <!-- Outer Card Tray -->
      <rect x="0" y="0" width="230" height="336" rx="20" fill="#0C1222" stroke="#1E293B" stroke-width="1.5"/>
      <!-- Inner Machined Inset -->
      <rect x="8" y="8" width="214" height="320" rx="14" fill="#090E1A" stroke="#38BDF8" stroke-width="0.8" stroke-opacity="0.3"/>

      <!-- Badge Header Strip -->
      <rect x="8" y="8" width="214" height="28" rx="14" fill="#0F172A"/>
      <circle cx="26" cy="22" r="3" fill="#10B981" class="live-glow"/>
      <text x="36" y="25" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#38BDF8" letter-spacing="1">SYSTEMS ENGINEER PASS</text>
      <text x="210" y="25" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#64748B" text-anchor="end">2026</text>

      <!-- Engineer Avatar Monogram Frame -->
      <g transform="translate(35, 46)">
        <rect x="0" y="0" width="160" height="135" rx="14" fill="#0F172A" stroke="#1E293B" stroke-width="1.2"/>
        <rect x="4" y="4" width="152" height="127" rx="10" fill="#070B16"/>
        
        <!-- Center Cyber Emblem -->
        <circle cx="80" cy="67" r="42" fill="#0D1527" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.4"/>
        <circle cx="80" cy="67" r="32" fill="#090F1C" stroke="#818CF8" stroke-width="1" stroke-dasharray="4 6"/>
        <text x="80" y="75" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="900" fill="#FFFFFF" text-anchor="middle">MJ</text>
      </g>

      <!-- Identification Details -->
      <text x="115" y="206" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">Mukesh Joshi</text>
      <text x="115" y="222" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600" fill="#38BDF8" text-anchor="middle">FULL-STACK SYSTEMS</text>

      <line x1="24" y1="234" x2="206" y2="234" stroke="#1E293B" stroke-width="1"/>

      <!-- Specification Matrix -->
      <g transform="translate(24, 244)" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94A3B8">
        <text x="0" y="12" fill="#64748B">ID CODE:</text>
        <text x="182" y="12" fill="#FFFFFF" text-anchor="end" font-weight="700">MJ-2026-ENG</text>

        <text x="0" y="28" fill="#64748B">LOCATION:</text>
        <text x="182" y="28" fill="#00F0FF" text-anchor="end" font-weight="700">INDIA / IST</text>

        <text x="0" y="44" fill="#64748B">STATUS:</text>
        <text x="182" y="44" fill="#10B981" text-anchor="end" font-weight="700">DEPLOYING</text>
      </g>

      <!-- Machine Barcode -->
      <g transform="translate(24, 304)">
        <rect x="0" y="0" width="2" height="14" fill="#64748B"/>
        <rect x="4" y="0" width="4" height="14" fill="#64748B"/>
        <rect x="11" y="0" width="2" height="14" fill="#64748B"/>
        <rect x="15" y="0" width="5" height="14" fill="#64748B"/>
        <rect x="23" y="0" width="3" height="14" fill="#64748B"/>
        <rect x="29" y="0" width="2" height="14" fill="#64748B"/>
        <rect x="34" y="0" width="6" height="14" fill="#64748B"/>
        <rect x="43" y="0" width="2" height="14" fill="#64748B"/>
        <rect x="48" y="0" width="4" height="14" fill="#64748B"/>
        <rect x="55" y="0" width="2" height="14" fill="#64748B"/>
        <rect x="60" y="0" width="5" height="14" fill="#64748B"/>
        <rect x="68" y="0" width="2" height="14" fill="#64748B"/>
        <rect x="73" y="0" width="4" height="14" fill="#64748B"/>
        <rect x="80" y="0" width="6" height="14" fill="#64748B"/>
        <rect x="89" y="0" width="2" height="14" fill="#64748B"/>
        <rect x="94" y="0" width="5" height="14" fill="#64748B"/>
        <rect x="102" y="0" width="2" height="14" fill="#64748B"/>
        <rect x="107" y="0" width="4" height="14" fill="#64748B"/>
        <rect x="114" y="0" width="3" height="14" fill="#64748B"/>
        <rect x="120" y="0" width="2" height="14" fill="#64748B"/>
        <rect x="125" y="0" width="6" height="14" fill="#64748B"/>
        <rect x="134" y="0" width="2" height="14" fill="#64748B"/>
        <rect x="139" y="0" width="4" height="14" fill="#64748B"/>
        <rect x="146" y="0" width="2" height="14" fill="#64748B"/>
        <rect x="151" y="0" width="5" height="14" fill="#64748B"/>
        <rect x="159" y="0" width="3" height="14" fill="#64748B"/>
        <rect x="165" y="0" width="2" height="14" fill="#64748B"/>
        <rect x="170" y="0" width="6" height="14" fill="#64748B"/>
        <rect x="179" y="0" width="3" height="14" fill="#64748B"/>
      </g>
    </g>
  </g>

  <!-- ================= RIGHT: TELEMETRY & CAPABILITY MATRIX ================= -->
  <g transform="translate(315, 34)">
    
    <!-- Header -->
    <g transform="translate(0, 0)">
      <text x="0" y="16" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#00F0FF" letter-spacing="2">// OPERATIONS TELEMETRY &amp; METRICS</text>
      <g transform="translate(470, 4)">
        <circle cx="0" cy="11" r="3" fill="#10B981" class="live-glow"/>
        <text x="10" y="14" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#34D399">VERIFIED ARCHIVES</text>
      </g>
      <text x="0" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="800" fill="#FFFFFF">Real-World Engineering Impact</text>
    </g>

    <!-- 4 Honest Macro Stat Cards -->
    <g transform="translate(0, 60)">
      
      <!-- Card 1: 32+ Public Repos -->
      <g transform="translate(0, 0)">
        <rect width="134" height="64" rx="14" fill="#0F172A" stroke="#1E293B" stroke-width="1.2"/>
        <text x="16" y="34" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="800" fill="#00F0FF">32+</text>
        <text x="16" y="50" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" fill="#38BDF8" letter-spacing="1">PUBLIC REPOS</text>
      </g>

      <!-- Card 2: Core Focus -->
      <g transform="translate(146, 0)">
        <rect width="134" height="64" rx="14" fill="#0F172A" stroke="#1E293B" stroke-width="1.2"/>
        <text x="16" y="34" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="800" fill="#FACC15">Full-Stack</text>
        <text x="16" y="50" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" fill="#EAB308" letter-spacing="1">CORE FOCUS</text>
      </g>

      <!-- Card 3: Philosophy -->
      <g transform="translate(292, 0)">
        <rect width="134" height="64" rx="14" fill="#0F172A" stroke="#1E293B" stroke-width="1.2"/>
        <text x="16" y="34" font-family="'Plus Jakarta Sans', sans-serif" font-size="17" font-weight="800" fill="#A855F7">Zero-Drift</text>
        <text x="16" y="50" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" fill="#A855F7" letter-spacing="1">LEDGER RULES</text>
      </g>

      <!-- Card 4: Status -->
      <g transform="translate(438, 0)">
        <rect width="144" height="64" rx="14" fill="#0F172A" stroke="#1E293B" stroke-width="1.2"/>
        <text x="16" y="34" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="800" fill="#10B981">Production</text>
        <text x="16" y="50" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" fill="#34D399" letter-spacing="1">SYSTEM READY</text>
      </g>
    </g>

    <!-- Bottom Split: Capability Meters + Production Systems Index -->
    <g transform="translate(0, 140)">
      
      <!-- Left: Proficiency & Architecture Meters -->
      <g transform="translate(0, 0)">
        <rect width="280" height="216" rx="16" fill="#0C1222" stroke="#1E293B" stroke-width="1.2"/>
        <text x="18" y="26" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#38BDF8" letter-spacing="1">CORE SYSTEM CAPACITIES</text>
        
        <!-- Metric 1: Frontend & Micro-interactions -->
        <g transform="translate(18, 42)">
          <text x="0" y="10" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#E2E8F0">Frontend Architecture</text>
          <text x="244" y="10" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#00F0FF" text-anchor="end">96%</text>
          <rect x="0" y="16" width="244" height="6" rx="3" fill="#1E293B"/>
          <rect x="0" y="16" width="234" height="6" rx="3" fill="url(#meterCyan)"/>
        </g>

        <!-- Metric 2: Distributed Backend & APIs -->
        <g transform="translate(18, 76)">
          <text x="0" y="10" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#E2E8F0">Backend &amp; API Design</text>
          <text x="244" y="10" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#C084FC" text-anchor="end">92%</text>
          <rect x="0" y="16" width="244" height="6" rx="3" fill="#1E293B"/>
          <rect x="0" y="16" width="224" height="6" rx="3" fill="url(#meterPurple)"/>
        </g>

        <!-- Metric 3: Database & SQL Ledger Integrity -->
        <g transform="translate(18, 110)">
          <text x="0" y="10" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#E2E8F0">Database &amp; Data Integrity</text>
          <text x="244" y="10" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#34D399" text-anchor="end">90%</text>
          <rect x="0" y="16" width="244" height="6" rx="3" fill="#1E293B"/>
          <rect x="0" y="16" width="219" height="6" rx="3" fill="url(#meterEmerald)"/>
        </g>

        <!-- Metric 4: Kinetic Physics & UI Motion -->
        <g transform="translate(18, 144)">
          <text x="0" y="10" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#E2E8F0">Kinetic Physics &amp; Motion</text>
          <text x="244" y="10" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#F472B6" text-anchor="end">94%</text>
          <rect x="0" y="16" width="244" height="6" rx="3" fill="#1E293B"/>
          <rect x="0" y="16" width="229" height="6" rx="3" fill="url(#meterPink)"/>
        </g>
        
        <text x="18" y="196" font-family="'JetBrains Mono', monospace" font-size="9" fill="#64748B">BENCHMARK: SUB-SECOND LATENCY &amp; 0 CLS</text>
      </g>

      <!-- Right: Production Deployments Showcase -->
      <g transform="translate(294, 0)">
        <rect width="288" height="216" rx="16" fill="#0C1222" stroke="#1E293B" stroke-width="1.2"/>
        <text x="18" y="26" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#A855F7" letter-spacing="1">FLAGSHIP PRODUCTION REPOS</text>
        
        <!-- Project 1: FlowStock -->
        <g transform="translate(18, 44)">
          <circle cx="4" cy="6" r="3.5" fill="#00F0FF"/>
          <text x="14" y="8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">FlowStock</text>
          <text x="14" y="22" font-family="'Inter', sans-serif" font-size="10.5" fill="#94A3B8">Financial-grade double-entry inventory ledger</text>
        </g>

        <!-- Project 2: ColabIDE -->
        <g transform="translate(18, 96)">
          <circle cx="4" cy="6" r="3.5" fill="#8B5CF6"/>
          <text x="14" y="8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">ColabIDE</text>
          <text x="14" y="22" font-family="'Inter', sans-serif" font-size="10.5" fill="#94A3B8">Real-time collaborative code editor &amp; virtual runtime</text>
        </g>

        <!-- Project 3: MYPortfolio -->
        <g transform="translate(18, 148)">
          <circle cx="4" cy="6" r="3.5" fill="#10B981"/>
          <text x="14" y="8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">MYPortfolio</text>
          <text x="14" y="22" font-family="'Inter', sans-serif" font-size="10.5" fill="#94A3B8">Cinematic interactive showcase with 60 FPS motion</text>
        </g>
      </g>

    </g>
  </g>
</svg>
