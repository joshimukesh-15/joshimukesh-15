<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cardBg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E111A"/>
      <stop offset="50%" stop-color="#121624"/>
      <stop offset="100%" stop-color="#0B0D14"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.7"/>
      <stop offset="40%" stop-color="#4DEEEA" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFE494" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Lanyard Ribbon Gradient -->
    <linearGradient id="lanyardRibbon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="30%" stop-color="#EF4444"/>
      <stop offset="70%" stop-color="#B91C1C"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>

    <!-- Metallic Clip Gradient -->
    <linearGradient id="metalClip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <!-- Badge Card Surface -->
    <linearGradient id="badgeGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2337" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#101322" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Mana Bar Gradients -->
    <linearGradient id="manaBar1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>

    <linearGradient id="manaBar2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <linearGradient id="manaBar3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      @keyframes floatCard {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-4px) rotate(0.4deg); }
      }
      .lanyardCard { transform-origin: 160px 50px; animation: floatCard 6s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Outer Card Frame -->
  <rect x="2" y="2" width="936" height="436" rx="26" fill="url(#cardBg3)" stroke="url(#borderGrad3)" stroke-width="2"/>

  <!-- ================= LEFT: LANYARD FIRST-CLASS MAGE ID BADGE ================= -->
  <g class="lanyardCard">
    <!-- Red Lanyard Strap Hanging from top -->
    <rect x="145" y="0" width="28" height="62" fill="url(#lanyardRibbon)"/>
    <line x1="149" y1="0" x2="149" y2="62" stroke="#FEF08A" stroke-width="1.5" stroke-dasharray="4 2"/>
    <line x1="169" y1="0" x2="169" y2="62" stroke="#FEF08A" stroke-width="1.5" stroke-dasharray="4 2"/>

    <!-- Metallic Clip -->
    <rect x="141" y="58" width="36" height="14" rx="4" fill="url(#metalClip)"/>
    <ellipse cx="159" cy="74" rx="7" ry="5" fill="none" stroke="url(#metalClip)" stroke-width="3"/>

    <!-- Translucent Lanyard ID Card Body -->
    <g transform="translate(42, 82)">
      <!-- Outer Card Glow & Border -->
      <rect x="0" y="0" width="236" height="326" rx="18" fill="url(#badgeGlass)" stroke="#EF4444" stroke-opacity="0.6" stroke-width="1.8" filter="url(#badgeGlow)"/>
      <rect x="0" y="0" width="236" height="326" rx="18" fill="url(#badgeGlass)" stroke="#4DEEEA" stroke-opacity="0.7" stroke-width="1.5"/>

      <!-- Card Header Strip -->
      <path d="M 0 18 Q 0 0 18 0 L 218 0 Q 236 0 236 18 L 236 34 L 0 34 Z" fill="#EF4444" fill-opacity="0.18"/>
      <text x="118" y="22" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#FFE494" text-anchor="middle" letter-spacing="1.5">
        CONTINENTAL MAGIC GUILD
      </text>

      <!-- Holographic Character / Avatar Frame -->
      <g transform="translate(48, 46)">
        <rect width="140" height="130" rx="14" fill="#0C0E17" stroke="#4DEEEA" stroke-width="1.2"/>
        
        <!-- Frieren Silhouette Portrait -->
        <!-- Aura Circle -->
        <circle cx="70" cy="65" r="48" fill="#4DEEEA" opacity="0.1"/>
        <circle cx="70" cy="65" r="42" fill="none" stroke="#FFE494" stroke-width="0.8" stroke-dasharray="3 3"/>
        <!-- Cape -->
        <path d="M 30 115 Q 70 88 110 115 L 125 130 L 15 130 Z" fill="#1E293B"/>
        <path d="M 45 115 Q 70 98 95 115 L 98 130 L 42 130 Z" fill="#EDE9FE"/>
        <!-- Twin Tails -->
        <path d="M 40 45 Q 22 75 18 115 Q 32 110 38 90 Q 42 65 48 50 Z" fill="#F8FAFC"/>
        <path d="M 100 45 Q 118 75 122 115 Q 108 110 102 90 Q 98 65 92 50 Z" fill="#F8FAFC"/>
        <!-- Face & Hair -->
        <path d="M 48 50 Q 70 85 92 50 Q 88 30 52 30 Z" fill="#FCE7F3"/>
        <polygon points="43,48 26,40 45,55" fill="#FCE7F3"/>
        <polygon points="97,48 114,40 95,55" fill="#FCE7F3"/>
        <path d="M 45 32 Q 70 18 95 32 Q 88 50 82 52 Q 70 38 58 52 Z" fill="#FFFFFF"/>
        <!-- Emerald Earrings -->
        <polygon points="32,54 35,60 32,66 29,60" fill="#10B981"/>
        <polygon points="108,54 111,60 108,66 105,60" fill="#10B981"/>
        <!-- Eyes -->
        <circle cx="58" cy="50" r="2.8" fill="#0EA5E9"/>
        <circle cx="82" cy="50" r="2.8" fill="#0EA5E9"/>
      </g>

      <!-- Name & Mage Title -->
      <text x="118" y="196" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">
        Mukesh Joshi
      </text>
      <text x="118" y="213" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#4DEEEA" text-anchor="middle" letter-spacing="1.2">
        FIRST-CLASS MAGE · FULL-STACK
      </text>

      <!-- Guild Stats Line -->
      <g transform="translate(20, 226)">
        <text x="0" y="14" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#78829D">AFFIL</text>
        <text x="50" y="14" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="600" fill="#E2E8F0">Kauf Forest Guild</text>
        
        <text x="0" y="28" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#78829D">SERIAL</text>
        <text x="50" y="28" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="600" fill="#FFE494">MKSH-2026-ENDE</text>
        
        <text x="0" y="42" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#78829D">RANK</text>
        <text x="50" y="42" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#10B981">S-Rank Operative</text>
      </g>

      <!-- Bottom Barcode & Active Duty Chip -->
      <g transform="translate(18, 282)">
        <!-- Barcode lines -->
        <rect x="0" y="4" width="2" height="18" fill="#4DEEEA"/>
        <rect x="4" y="4" width="4" height="18" fill="#4DEEEA"/>
        <rect x="10" y="4" width="1" height="18" fill="#4DEEEA"/>
        <rect x="13" y="4" width="3" height="18" fill="#4DEEEA"/>
        <rect x="18" y="4" width="2" height="18" fill="#4DEEEA"/>
        <rect x="22" y="4" width="4" height="18" fill="#4DEEEA"/>
        <rect x="28" y="4" width="1" height="18" fill="#4DEEEA"/>
        <rect x="31" y="4" width="2" height="18" fill="#4DEEEA"/>
        <rect x="35" y="4" width="4" height="18" fill="#4DEEEA"/>
        <rect x="41" y="4" width="2" height="18" fill="#4DEEEA"/>

        <!-- Active Status Chip -->
        <rect x="94" y="0" width="104" height="24" rx="8" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-width="1"/>
        <circle cx="106" cy="12" r="3.5" fill="#10B981"/>
        <text x="116" y="16" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#34D399">ACTIVE DUTY</text>
      </g>
    </g>
  </g>

  <!-- ================= RIGHT: STATS TILES & MANA BREAKDOWN ================= -->
  <g transform="translate(325, 34)">
    
    <!-- Header -->
    <g>
      <text x="0" y="20" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#EF4444" letter-spacing="3">// ADVENTURER GUILD RECORD</text>
      <rect x="475" y="6" width="105" height="22" rx="6" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-width="0.8"/>
      <circle cx="486" cy="17" r="3" fill="#10B981"/>
      <text x="495" y="21" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#34D399">LIVE SYNC 2026</text>
      
      <text x="0" y="54" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">Stats from the field</text>
    </g>

    <!-- 4 Top KPI Stat Tiles (Like Slide 3) -->
    <g transform="translate(0, 74)">
      <!-- Repos -->
      <g transform="translate(0, 0)">
        <rect width="136" height="66" rx="14" fill="#161B2A" stroke="#252D42" stroke-width="1.2"/>
        <text x="16" y="36" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">35+</text>
        <text x="16" y="52" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600" fill="#EF4444" letter-spacing="1">PUBLIC REPOS</text>
        <text x="118" y="32" font-family="'Inter', sans-serif" font-size="14" text-anchor="end">📦</text>
      </g>
      <!-- Stars -->
      <g transform="translate(148, 0)">
        <rect width="136" height="66" rx="14" fill="#161B2A" stroke="#252D42" stroke-width="1.2"/>
        <text x="16" y="36" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="800" fill="#FFE494">100+</text>
        <text x="16" y="52" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600" fill="#F59E0B" letter-spacing="1">STARS EARNED</text>
        <text x="118" y="32" font-family="'Inter', sans-serif" font-size="14" text-anchor="end">⭐</text>
      </g>
      <!-- Forks -->
      <g transform="translate(296, 0)">
        <rect width="136" height="66" rx="14" fill="#161B2A" stroke="#252D42" stroke-width="1.2"/>
        <text x="16" y="36" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">50+</text>
        <text x="16" y="52" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600" fill="#06B6D4" letter-spacing="1">FORKS / CITATIONS</text>
        <text x="118" y="32" font-family="'Inter', sans-serif" font-size="14" text-anchor="end">🍴</text>
      </g>
      <!-- Mage Rank -->
      <g transform="translate(444, 0)">
        <rect width="136" height="66" rx="14" fill="#161B2A" stroke="#252D42" stroke-width="1.2"/>
        <text x="16" y="36" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="800" fill="#4DEEEA">S-Rank</text>
        <text x="16" y="52" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600" fill="#10B981" letter-spacing="1">GUILD CLASS</text>
        <text x="118" y="32" font-family="'Inter', sans-serif" font-size="14" text-anchor="end">🎖️</text>
      </g>
    </g>

    <!-- Lower Deck: Left Spell Affinities + Right Guild Quest Dossier -->
    <g transform="translate(0, 156)">
      <!-- Left: Top Spell Affinities (Bars) -->
      <rect x="0" y="0" width="310" height="206" rx="16" fill="#141826" stroke="#22283A" stroke-width="1.2"/>
      <text x="18" y="26" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#FFE494" letter-spacing="1">TOP ARSENAL &amp; MANA AFFINITY</text>
      
      <!-- Bar 1: React / Next.js -->
      <g transform="translate(18, 44)">
        <text x="0" y="10" font-family="'Inter', sans-serif" font-size="11.5" font-weight="600" fill="#E2E8F0">React &amp; Next.js</text>
        <text x="274" y="10" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#4DEEEA" text-anchor="end">96%</text>
        <rect x="0" y="16" width="274" height="6" rx="3" fill="#1E2436"/>
        <rect x="0" y="16" width="263" height="6" rx="3" fill="url(#manaBar2)"/>
      </g>
      <!-- Bar 2: Python / FastAPI -->
      <g transform="translate(18, 76)">
        <text x="0" y="10" font-family="'Inter', sans-serif" font-size="11.5" font-weight="600" fill="#E2E8F0">Python &amp; FastAPI</text>
        <text x="274" y="10" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#FFE494" text-anchor="end">91%</text>
        <rect x="0" y="16" width="274" height="6" rx="3" fill="#1E2436"/>
        <rect x="0" y="16" width="249" height="6" rx="3" fill="url(#manaBar1)"/>
      </g>
      <!-- Bar 3: SQL & Immutable Ledgers -->
      <g transform="translate(18, 108)">
        <text x="0" y="10" font-family="'Inter', sans-serif" font-size="11.5" font-weight="600" fill="#E2E8F0">SQL Ledgers &amp; PostgreSQL</text>
        <text x="274" y="10" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#34D399" text-anchor="end">88%</text>
        <rect x="0" y="16" width="274" height="6" rx="3" fill="#1E2436"/>
        <rect x="0" y="16" width="241" height="6" rx="3" fill="url(#manaBar3)"/>
      </g>
      <!-- Bar 4: Framer Motion & Interactive UI -->
      <g transform="translate(18, 140)">
        <text x="0" y="10" font-family="'Inter', sans-serif" font-size="11.5" font-weight="600" fill="#E2E8F0">Framer Motion &amp; GSAP</text>
        <text x="274" y="10" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#F472B6" text-anchor="end">94%</text>
        <rect x="0" y="16" width="274" height="6" rx="3" fill="#1E2436"/>
        <rect x="0" y="16" width="257" height="6" rx="3" fill="#EC4899"/>
      </g>

      <!-- Right: Quests & Active Expeditions -->
      <g transform="translate(322, 0)">
        <rect x="0" y="0" width="258" height="206" rx="16" fill="#141826" stroke="#22283A" stroke-width="1.2"/>
        <text x="18" y="26" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#4DEEEA" letter-spacing="1">CHAKRA / MANA RECORD</text>
        
        <g transform="translate(18, 44)">
          <circle cx="4" cy="6" r="3.5" fill="#EF4444"/>
          <text x="14" y="8" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#F8FAFC">TARGET 01: FlowStock</text>
          <text x="14" y="22" font-family="'Inter', sans-serif" font-size="10" fill="#8E95A8">Financial inventory ledger engine</text>
        </g>

        <g transform="translate(18, 92)">
          <circle cx="4" cy="6" r="3.5" fill="#3B82F6"/>
          <text x="14" y="8" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#F8FAFC">TARGET 02: ColabIDE</text>
          <text x="14" y="22" font-family="'Inter', sans-serif" font-size="10" fill="#8E95A8">Real-time collaborative code editor</text>
        </g>

        <g transform="translate(18, 140)">
          <circle cx="4" cy="6" r="3.5" fill="#10B981"/>
          <text x="14" y="8" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#F8FAFC">TARGET 03: MYPortfolio</text>
          <text x="14" y="22" font-family="'Inter', sans-serif" font-size="10" fill="#8E95A8">Interactive high-octane portfolio</text>
        </g>
      </g>
    </g>

  </g>
</svg>
