<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="voidBg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070D"/>
      <stop offset="50%" stop-color="#0B0E1B"/>
      <stop offset="100%" stop-color="#040509"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="jjkBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#A855F7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Crimson Lanyard Strap Gradient -->
    <linearGradient id="jjkLanyard" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7F1D1D"/>
      <stop offset="35%" stop-color="#DC2626"/>
      <stop offset="70%" stop-color="#B91C1C"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>

    <!-- Metallic Clip Gradient -->
    <linearGradient id="metalClip2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Badge Card Surface -->
    <linearGradient id="badgeGlass2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#070A12" stop-opacity="0.96"/>
    </linearGradient>

    <!-- Bar Gradients -->
    <linearGradient id="barBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <linearGradient id="barPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <linearGradient id="barRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>

    <filter id="cardGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      @keyframes floatLanyard {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-4px) rotate(0.4deg); }
      }
      .lanyardCard { transform-origin: 160px 50px; animation: floatLanyard 6s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Outer Card Frame -->
  <rect x="2" y="2" width="936" height="436" rx="26" fill="url(#voidBg3)" stroke="url(#jjkBorder)" stroke-width="2"/>

  <!-- ================= LEFT: LANYARD SPECIAL GRADE ID BADGE ================= -->
  <g class="lanyardCard">
    <!-- Crimson Lanyard Strap Hanging from top -->
    <rect x="145" y="0" width="28" height="62" fill="url(#jjkLanyard)"/>
    <line x1="149" y1="0" x2="149" y2="62" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="4 2"/>
    <line x1="169" y1="0" x2="169" y2="62" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="4 2"/>

    <!-- Metallic Clip -->
    <rect x="141" y="58" width="36" height="14" rx="4" fill="url(#metalClip2)"/>
    <ellipse cx="159" cy="74" rx="7" ry="5" fill="none" stroke="url(#metalClip2)" stroke-width="3"/>

    <!-- Translucent Lanyard ID Card Body -->
    <g transform="translate(42, 82)">
      <!-- Outer Card Glow & Border -->
      <rect x="0" y="0" width="236" height="326" rx="18" fill="url(#badgeGlass2)" stroke="#EF4444" stroke-opacity="0.6" stroke-width="1.8" filter="url(#cardGlow)"/>
      <rect x="0" y="0" width="236" height="326" rx="18" fill="url(#badgeGlass2)" stroke="#00F0FF" stroke-opacity="0.7" stroke-width="1.5"/>

      <!-- Card Header Strip -->
      <path d="M 0 18 Q 0 0 18 0 L 218 0 Q 236 0 236 18 L 236 34 L 0 34 Z" fill="#EF4444" fill-opacity="0.2"/>
      <text x="118" y="22" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#F8FAFC" text-anchor="middle" letter-spacing="1.5">
        TOKYO JUJUTSU HIGH SCHOOL
      </text>

      <!-- Holographic Avatar Frame -->
      <g transform="translate(48, 46)">
        <rect width="140" height="130" rx="14" fill="#060913" stroke="#00F0FF" stroke-width="1.2"/>
        
        <!-- Six Eyes Glow behind Avatar -->
        <circle cx="70" cy="65" r="48" fill="#00F0FF" opacity="0.15"/>
        <circle cx="70" cy="65" r="42" fill="none" stroke="#A855F7" stroke-width="0.8" stroke-dasharray="4 4"/>
        
        <!-- Dark High Collar Coat -->
        <path d="M 25 115 Q 70 88 115 115 L 125 130 L 15 130 Z" fill="#0B132B"/>
        <path d="M 50 115 L 70 95 L 90 115 L 70 125 Z" fill="#1E293B"/>

        <!-- Spiky Pure Snow White Hair -->
        <path d="M 38 52 Q 42 16 70 16 Q 98 16 102 52 Q 92 28 70 30 Q 48 28 38 52 Z" fill="#FFFFFF"/>
        <path d="M 45 40 Q 52 18 68 22 Q 60 32 54 44 Z" fill="#F1F5F9"/>
        <path d="M 95 40 Q 88 18 72 22 Q 80 32 86 44 Z" fill="#F1F5F9"/>

        <!-- Face -->
        <path d="M 48 50 Q 70 85 92 50 Q 88 32 52 32 Z" fill="#FED7AA"/>

        <!-- Black Blindfold with Glowing Six Eyes -->
        <rect x="44" y="46" width="52" height="14" rx="4" fill="#020617" stroke="#00F0FF" stroke-width="0.8"/>
        <!-- Six Eyes Cyan Sparks -->
        <circle cx="58" cy="53" r="2.8" fill="#00F0FF"/>
        <circle cx="58" cy="53" r="1.2" fill="#FFFFFF"/>
        <circle cx="82" cy="53" r="2.8" fill="#00F0FF"/>
        <circle cx="82" cy="53" r="1.2" fill="#FFFFFF"/>
        <!-- Smirk -->
        <path d="M 64 70 Q 70 74 76 70" stroke="#DC2626" stroke-width="0.8" fill="none"/>
      </g>

      <!-- Name & Sorcerer Title -->
      <text x="118" y="196" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">
        Mukesh Joshi
      </text>
      <text x="118" y="213" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#00F0FF" text-anchor="middle" letter-spacing="1.2">
        SPECIAL GRADE · FULL-STACK
      </text>

      <!-- Sorcerer Dossier Specs -->
      <g transform="translate(20, 226)">
        <text x="0" y="14" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#64748B">AFFIL</text>
        <text x="50" y="14" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="600" fill="#F8FAFC">Tokyo Jujutsu High</text>
        
        <text x="0" y="28" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#64748B">SERIAL</text>
        <text x="50" y="28" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="600" fill="#A855F7">JJK-GOJO-2026-VOID</text>
        
        <text x="0" y="42" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#64748B">CLASS</text>
        <text x="50" y="42" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#EF4444">Special Grade Sorcerer</text>
      </g>

      <!-- Bottom Barcode & Domain Active Chip -->
      <g transform="translate(18, 282)">
        <!-- Barcode -->
        <rect x="0" y="4" width="2" height="18" fill="#00F0FF"/>
        <rect x="4" y="4" width="4" height="18" fill="#00F0FF"/>
        <rect x="10" y="4" width="1" height="18" fill="#00F0FF"/>
        <rect x="13" y="4" width="3" height="18" fill="#00F0FF"/>
        <rect x="18" y="4" width="2" height="18" fill="#00F0FF"/>
        <rect x="22" y="4" width="4" height="18" fill="#00F0FF"/>
        <rect x="28" y="4" width="1" height="18" fill="#00F0FF"/>
        <rect x="31" y="4" width="2" height="18" fill="#00F0FF"/>
        <rect x="35" y="4" width="4" height="18" fill="#00F0FF"/>
        <rect x="41" y="4" width="2" height="18" fill="#00F0FF"/>

        <!-- Domain Active Chip -->
        <rect x="94" y="0" width="104" height="24" rx="8" fill="#00F0FF" fill-opacity="0.15" stroke="#00F0FF" stroke-width="1"/>
        <circle cx="106" cy="12" r="3.5" fill="#00F0FF"/>
        <text x="116" y="16" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#38BDF8">DOMAIN ACTIVE</text>
      </g>
    </g>
  </g>

  <!-- ================= RIGHT: STATS TILES & CURSED OUTPUT ================= -->
  <g transform="translate(325, 34)">
    
    <!-- Header -->
    <g>
      <text x="0" y="20" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#EF4444" letter-spacing="3">// JUJUTSU HIGH MISSION RECORD</text>
      <rect x="475" y="6" width="105" height="22" rx="6" fill="#00F0FF" fill-opacity="0.15" stroke="#00F0FF" stroke-width="0.8"/>
      <circle cx="486" cy="17" r="3" fill="#00F0FF"/>
      <text x="495" y="21" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#38BDF8">LIVE SYNC 2026</text>
      
      <text x="0" y="54" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">Stats from the field</text>
    </g>

    <!-- 4 Top KPI Stat Tiles -->
    <g transform="translate(0, 74)">
      <!-- Repos -->
      <g transform="translate(0, 0)">
        <rect width="136" height="66" rx="14" fill="#0F1424" stroke="#1E2A4A" stroke-width="1.2"/>
        <text x="16" y="36" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">35+</text>
        <text x="16" y="52" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600" fill="#00F0FF" letter-spacing="1">CURSED REPOS</text>
        <text x="118" y="32" font-family="'Inter', sans-serif" font-size="14" text-anchor="end">📦</text>
      </g>
      <!-- Stars -->
      <g transform="translate(148, 0)">
        <rect width="136" height="66" rx="14" fill="#0F1424" stroke="#1E2A4A" stroke-width="1.2"/>
        <text x="16" y="36" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="800" fill="#FACC15">100+</text>
        <text x="16" y="52" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600" fill="#EAB308" letter-spacing="1">STARS EARNED</text>
        <text x="118" y="32" font-family="'Inter', sans-serif" font-size="14" text-anchor="end">⭐</text>
      </g>
      <!-- Forks -->
      <g transform="translate(296, 0)">
        <rect width="136" height="66" rx="14" fill="#0F1424" stroke="#1E2A4A" stroke-width="1.2"/>
        <text x="16" y="36" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">50+</text>
        <text x="16" y="52" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600" fill="#A855F7" letter-spacing="1">FORKS / CITATIONS</text>
        <text x="118" y="32" font-family="'Inter', sans-serif" font-size="14" text-anchor="end">🍴</text>
      </g>
      <!-- Sorcerer Rank -->
      <g transform="translate(444, 0)">
        <rect width="136" height="66" rx="14" fill="#0F1424" stroke="#1E2A4A" stroke-width="1.2"/>
        <text x="16" y="36" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="800" fill="#EF4444">Special</text>
        <text x="16" y="52" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600" fill="#EF4444" letter-spacing="1">GRADE RANK</text>
        <text x="118" y="32" font-family="'Inter', sans-serif" font-size="14" text-anchor="end">🎖️</text>
      </g>
    </g>

    <!-- Lower Deck: Technique Mastery Bars + Special Grade Targets -->
    <g transform="translate(0, 156)">
      <!-- Left: Technique Mastery Bars -->
      <rect x="0" y="0" width="310" height="206" rx="16" fill="#0C101E" stroke="#1C2438" stroke-width="1.2"/>
      <text x="18" y="26" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#00F0FF" letter-spacing="1">CURSED ENERGY OUTPUT</text>
      
      <!-- Bar 1: React & Next.js Domain -->
      <g transform="translate(18, 44)">
        <text x="0" y="10" font-family="'Inter', sans-serif" font-size="11.5" font-weight="600" fill="#E2E8F0">React &amp; Next.js Domain</text>
        <text x="274" y="10" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#00F0FF" text-anchor="end">98%</text>
        <rect x="0" y="16" width="274" height="6" rx="3" fill="#1A2236"/>
        <rect x="0" y="16" width="268" height="6" rx="3" fill="url(#barBlue)"/>
      </g>
      <!-- Bar 2: Python / FastAPI -->
      <g transform="translate(18, 76)">
        <text x="0" y="10" font-family="'Inter', sans-serif" font-size="11.5" font-weight="600" fill="#E2E8F0">Python &amp; FastAPI Sorcery</text>
        <text x="274" y="10" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#C084FC" text-anchor="end">93%</text>
        <rect x="0" y="16" width="274" height="6" rx="3" fill="#1A2236"/>
        <rect x="0" y="16" width="254" height="6" rx="3" fill="url(#barPurple)"/>
      </g>
      <!-- Bar 3: SQL Ledgers -->
      <g transform="translate(18, 108)">
        <text x="0" y="10" font-family="'Inter', sans-serif" font-size="11.5" font-weight="600" fill="#E2E8F0">SQL Ledgers &amp; PostgreSQL</text>
        <text x="274" y="10" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#EF4444" text-anchor="end">89%</text>
        <rect x="0" y="16" width="274" height="6" rx="3" fill="#1A2236"/>
        <rect x="0" y="16" width="244" height="6" rx="3" fill="url(#barRed)"/>
      </g>
      <!-- Bar 4: Framer Motion Kinetic -->
      <g transform="translate(18, 140)">
        <text x="0" y="10" font-family="'Inter', sans-serif" font-size="11.5" font-weight="600" fill="#E2E8F0">Framer Motion Kinetic Physics</text>
        <text x="274" y="10" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#F472B6" text-anchor="end">95%</text>
        <rect x="0" y="16" width="274" height="6" rx="3" fill="#1A2236"/>
        <rect x="0" y="16" width="260" height="6" rx="3" fill="#EC4899"/>
      </g>

      <!-- Right: Special Grade Cursed Tools / Targets -->
      <g transform="translate(322, 0)">
        <rect x="0" y="0" width="258" height="206" rx="16" fill="#0C101E" stroke="#1C2438" stroke-width="1.2"/>
        <text x="18" y="26" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#EF4444" letter-spacing="1">SPECIAL GRADE TARGETS</text>
        
        <g transform="translate(18, 44)">
          <circle cx="4" cy="6" r="3.5" fill="#00F0FF"/>
          <text x="14" y="8" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#F8FAFC">TARGET 01: FlowStock</text>
          <text x="14" y="22" font-family="'Inter', sans-serif" font-size="10" fill="#94A3B8">Financial inventory ledger engine</text>
        </g>

        <g transform="translate(18, 92)">
          <circle cx="4" cy="6" r="3.5" fill="#A855F7"/>
          <text x="14" y="8" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#F8FAFC">TARGET 02: ColabIDE</text>
          <text x="14" y="22" font-family="'Inter', sans-serif" font-size="10" fill="#94A3B8">Real-time collaborative code editor</text>
        </g>

        <g transform="translate(18, 140)">
          <circle cx="4" cy="6" r="3.5" fill="#EF4444"/>
          <text x="14" y="8" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#F8FAFC">TARGET 03: MYPortfolio</text>
          <text x="14" y="22" font-family="'Inter', sans-serif" font-size="10" fill="#94A3B8">Interactive high-octane portfolio</text>
        </g>
      </g>
    </g>

  </g>
</svg>
