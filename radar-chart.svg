<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" width="100%" height="100%">
  <defs>
    <radialGradient id="jjkRadarFill" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.65"/>
      <stop offset="60%" stop-color="#A855F7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0.15"/>
    </radialGradient>
    <filter id="radarBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dark Background surface -->
  <rect width="420" height="300" rx="18" fill="#0C101E" stroke="#1E2A4A" stroke-width="1.2"/>

  <!-- Title -->
  <text x="210" y="32" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#00F0FF" text-anchor="middle" letter-spacing="2">
    // SPECIAL GRADE COMBAT RADAR
  </text>

  <!-- Radar Grid Pentagon Rings (Center: 210, 160) -->
  <g fill="none" stroke="#1E293B" stroke-width="1">
    <!-- Ring 1 (Outer - 100%) -->
    <polygon points="210,75 295,136 262,238 158,238 125,136"/>
    <!-- Ring 2 (75%) -->
    <polygon points="210,96 274,142 249,218 171,218 146,142"/>
    <!-- Ring 3 (50%) -->
    <polygon points="210,118 252,148 236,199 184,199 168,148"/>
    <!-- Ring 4 (25%) -->
    <polygon points="210,139 231,154 223,179 197,179 189,154"/>

    <!-- Axis Lines -->
    <line x1="210" y1="160" x2="210" y2="75" stroke="#334155" stroke-dasharray="2 3"/>
    <line x1="210" y1="160" x2="295" y2="136" stroke="#334155" stroke-dasharray="2 3"/>
    <line x1="210" y1="160" x2="262" y2="238" stroke="#334155" stroke-dasharray="2 3"/>
    <line x1="210" y1="160" x2="158" y2="238" stroke="#334155" stroke-dasharray="2 3"/>
    <line x1="210" y1="160" x2="125" y2="136" stroke="#334155" stroke-dasharray="2 3"/>
  </g>

  <!-- Active Data Polygon (Mukesh's Special Grade Shape) -->
  <polygon points="210,80 290,138 258,232 165,234 132,138" fill="url(#jjkRadarFill)" stroke="#00F0FF" stroke-width="2" filter="url(#radarBloom)"/>

  <!-- Data Points -->
  <circle cx="210" cy="80" r="4.5" fill="#FFFFFF"/>
  <circle cx="290" cy="138" r="4.5" fill="#00F0FF"/>
  <circle cx="258" cy="232" r="4.5" fill="#A855F7"/>
  <circle cx="165" cy="234" r="4.5" fill="#EF4444"/>
  <circle cx="132" cy="138" r="4.5" fill="#38BDF8"/>

  <!-- Axis Labels -->
  <!-- Top: Commits -->
  <text x="210" y="65" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#F8FAFC" text-anchor="middle">Commits (98%)</text>
  <!-- Top-Right: Issues / Solves -->
  <text x="305" y="138" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#F8FAFC" text-anchor="start">Issues (94%)</text>
  <!-- Bottom-Right: Pull Requests -->
  <text x="272" y="258" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#F8FAFC" text-anchor="start">PullReq (95%)</text>
  <!-- Bottom-Left: Reviews -->
  <text x="148" y="258" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#F8FAFC" text-anchor="end">Review (88%)</text>
  <!-- Top-Left: Repos / Builds -->
  <text x="115" y="138" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#F8FAFC" text-anchor="end">Repos (92%)</text>

  <!-- Bottom Rank Badge -->
  <text x="210" y="285" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#00F0FF" text-anchor="middle">
    OVERALL POTENTIAL: SATORU GOJO LEVEL (THE STRONGEST)
  </text>
</svg>
