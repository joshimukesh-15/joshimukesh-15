<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 300" width="940" height="300">
  <defs>
    <!-- Deep Obsidian Canvas -->
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070F"/>
      <stop offset="50%" stop-color="#080C17"/>
      <stop offset="100%" stop-color="#03050C"/>
    </linearGradient>

    <!-- Champagne Gold & Titanium Border -->
    <linearGradient id="termBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="btnGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <linearGradient id="btnDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#141E33"/>
      <stop offset="100%" stop-color="#0C1322"/>
    </linearGradient>

    <style>
      @keyframes blinkTerm {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      .cursor-blink { animation: blinkTerm 1s step-end infinite; }
    </style>
  </defs>

  <!-- Shell Container -->
  <rect x="1" y="1" width="938" height="298" rx="24" fill="url(#termBg)"/>
  <rect x="1" y="1" width="938" height="298" rx="24" fill="none" stroke="url(#termBorder)" stroke-width="1.2"/>

  <!-- Terminal Title Bar -->
  <path d="M1 24 C1 11.3 11.3 1 24 1 L916 1 C928.7 1 939 11.3 939 24 L939 42 L1 42 Z" fill="#0A0F1D"/>
  <line x1="1" y1="42" x2="939" y2="42" stroke="#1E293B" stroke-width="1"/>

  <!-- Window Dots -->
  <circle cx="28" cy="21" r="5" fill="#EF4444"/>
  <circle cx="46" cy="21" r="5" fill="#F59E0B"/>
  <circle cx="64" cy="21" r="5" fill="#10B981"/>

  <text x="470" y="25" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#64748B" text-anchor="middle">
    mukesh@workstation: ~/communications/dispatch
  </text>

  <!-- Terminal Content Area -->
  <g transform="translate(42, 68)" font-family="'JetBrains Mono', monospace">
    
    <!-- Command Prompt 1 -->
    <text x="0" y="20" font-size="12.5" font-weight="700" fill="#10B981">$</text>
    <text x="18" y="20" font-size="12.5" font-weight="600" fill="#38BDF8">curl -X GET https://api.mukeshjoshi.dev/v1/status</text>

    <!-- Response Payload -->
    <text x="0" y="52" font-size="12" fill="#94A3B8">
      { <tspan fill="#38BDF8">"status"</tspan>: <tspan fill="#34D399">"AVAILABLE"</tspan>, <tspan fill="#38BDF8">"focus"</tspan>: <tspan fill="#FBBF24">"High-Impact Engineering"</tspan>, <tspan fill="#38BDF8">"location"</tspan>: <tspan fill="#F59E0B">"India (UTC+05:30)"</tspan> }
    </text>

    <!-- Command Prompt 2 -->
    <text x="0" y="90" font-size="12.5" font-weight="700" fill="#10B981">$</text>
    <text x="18" y="90" font-size="12.5" font-weight="600" fill="#FFFFFF">mukesh --initiate-collaboration --direct</text>
    <rect x="350" y="78" width="8" height="15" fill="#F59E0B" class="cursor-blink"/>

    <text x="0" y="118" font-size="11.5" fill="#64748B">
      &gt; Transmission link established. Select action below:
    </text>

    <!-- 3 Action CTAs (Comfortable Spacing, Zero Overflow) -->
    <g transform="translate(0, 142)">
      
      <!-- Button 1: Email Direct (Primary Gold) -->
      <g transform="translate(0, 0)">
        <rect width="250" height="46" rx="23" fill="url(#btnGold)"/>
        <text x="105" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#040711">Send Direct Email</text>
        <!-- Button-in-button icon -->
        <circle cx="225" cy="23" r="14" fill="#040711"/>
        <text x="225" y="28" font-family="'Inter', sans-serif" font-size="13" font-weight="900" fill="#FBBF24" text-anchor="middle">↗</text>
      </g>

      <!-- Button 2: GitHub Archives (Dark Titanium) -->
      <g transform="translate(270, 0)">
        <rect width="250" height="46" rx="23" fill="url(#btnDark)" stroke="#1E293B" stroke-width="1.2"/>
        <text x="96" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Inspect Repositories</text>
        <circle cx="225" cy="23" r="14" fill="#1E293B"/>
        <text x="225" y="28" font-family="'Inter', sans-serif" font-size="13" font-weight="900" fill="#FFFFFF" text-anchor="middle">↗</text>
      </g>

      <!-- Button 3: Timezone / Availability Pill -->
      <g transform="translate(540, 0)">
        <rect width="310" height="46" rx="23" fill="#0A0F1D" stroke="#1E293B" stroke-width="1.2"/>
        <circle cx="24" cy="23" r="4.5" fill="#10B981"/>
        <text x="38" y="27" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#34D399">UTC+05:30 • ACTIVE ENGINEERING NODE</text>
      </g>

    </g>

  </g>
</svg>
