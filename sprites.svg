<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 70" width="100%" height="100%">
  <defs>
    <style>
      @keyframes walkCycle {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        25% { transform: translateY(-4px) rotate(-3deg); }
        50% { transform: translateY(0px) rotate(0deg); }
        75% { transform: translateY(-4px) rotate(3deg); }
      }
      @keyframes partyMove {
        0% { transform: translateX(0px); }
        50% { transform: translateX(25px); }
        100% { transform: translateX(0px); }
      }
      .party { animation: partyMove 12s ease-in-out infinite; }
      .chibi1 { transform-origin: 430px 45px; animation: walkCycle 0.9s ease-in-out infinite; }
      .chibi2 { transform-origin: 470px 45px; animation: walkCycle 0.9s ease-in-out infinite 0.3s; }
      .chibi3 { transform-origin: 510px 45px; animation: walkCycle 0.9s ease-in-out infinite 0.6s; }
    </style>
  </defs>

  <!-- Walking Ground Starlight Line -->
  <line x1="120" y1="58" x2="820" y2="58" stroke="#252D42" stroke-width="1.2" stroke-dasharray="4 6"/>
  <circle cx="470" cy="58" r="3" fill="#4DEEEA" opacity="0.6"/>

  <g class="party">
    <!-- CHIBI 1: STARK (Left) -->
    <g class="chibi1" transform="translate(400, 14)">
      <!-- Body / Jacket (Orange & Black) -->
      <rect x="10" y="24" width="14" height="15" rx="3" fill="#EA580C"/>
      <!-- Legs -->
      <rect x="11" y="38" width="4" height="6" fill="#1E293B"/>
      <rect x="19" y="38" width="4" height="6" fill="#1E293B"/>
      <!-- Head / Hair (Red Spiky) -->
      <circle cx="17" cy="16" r="9" fill="#FCE7F3"/>
      <path d="M 8 16 Q 17 6 26 16 Q 22 8 17 8 Q 12 8 8 16 Z" fill="#DC2626"/>
      <!-- Axe on back -->
      <line x1="6" y1="12" x2="16" y2="34" stroke="#94A3B8" stroke-width="2"/>
      <path d="M 4 10 L 8 8 L 8 14 Z" fill="#64748B"/>
    </g>

    <!-- CHIBI 2: FRIEREN (Center) -->
    <g class="chibi2" transform="translate(455, 12)">
      <!-- Staff in hand -->
      <line x1="28" y1="8" x2="28" y2="44" stroke="#FFE494" stroke-width="1.8"/>
      <circle cx="28" cy="8" r="4.5" fill="#4DEEEA"/>
      <!-- White Cape & Robe -->
      <path d="M 6 24 L 24 24 L 28 42 L 2 42 Z" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="0.8"/>
      <rect x="11" y="24" width="8" height="12" fill="#EDE9FE"/>
      <!-- Twin Tails Hair (Silver) -->
      <path d="M 5 18 Q 1 26 0 35 Q 4 33 6 28 Z" fill="#E2E8F0"/>
      <path d="M 25 18 Q 29 26 30 35 Q 26 33 24 28 Z" fill="#E2E8F0"/>
      <!-- Head -->
      <circle cx="15" cy="16" r="9" fill="#FCE7F3"/>
      <!-- Elf Ears -->
      <polygon points="6,15 0,11 6,18" fill="#FCE7F3"/>
      <polygon points="24,15 30,11 24,18" fill="#FCE7F3"/>
      <!-- Hair Bangs -->
      <path d="M 7 15 Q 15 8 23 15 Q 20 12 15 12 Q 10 12 7 15 Z" fill="#FFFFFF"/>
      <!-- Eyes -->
      <circle cx="12" cy="16" r="1.5" fill="#0EA5E9"/>
      <circle cx="18" cy="16" r="1.5" fill="#0EA5E9"/>
    </g>

    <!-- CHIBI 3: FERN (Right) -->
    <g class="chibi3" transform="translate(510, 14)">
      <!-- Long Robe (Black / Deep Violet) -->
      <path d="M 7 24 L 23 24 L 26 42 L 4 42 Z" fill="#1E1B4B"/>
      <!-- Scarf (White) -->
      <rect x="9" y="23" width="12" height="4" rx="2" fill="#EDE9FE"/>
      <!-- Purple Hair -->
      <path d="M 6 18 Q 3 28 2 38 Q 6 35 8 28 Z" fill="#4C1D95"/>
      <path d="M 24 18 Q 27 28 28 38 Q 24 35 22 28 Z" fill="#4C1D95"/>
      <circle cx="15" cy="16" r="9" fill="#FCE7F3"/>
      <path d="M 7 15 Q 15 7 23 15 Q 19 11 15 11 Q 11 11 7 15 Z" fill="#3B0764"/>
      <!-- Eyes -->
      <circle cx="12" cy="16" r="1.5" fill="#A855F7"/>
      <circle cx="18" cy="16" r="1.5" fill="#A855F7"/>
    </g>
  </g>
</svg>
