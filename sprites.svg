<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 44" width="940" height="44">
  <defs>
    <linearGradient id="navBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#080D1A"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#080D1A"/>
    </linearGradient>
    <linearGradient id="navBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.3"/>
    </linearGradient>
    <style>
      @keyframes pulseNode {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(1.3); }
      }
      .node-pulse { transform-origin: 24px 22px; animation: pulseNode 2s ease-in-out infinite; }
    </style>
  </defs>

  <rect x="1" y="1" width="938" height="42" rx="21" fill="url(#navBg)"/>
  <rect x="1" y="1" width="938" height="42" rx="21" fill="none" stroke="url(#navBorder)" stroke-width="1.2"/>

  <!-- Left: System Live Status -->
  <g transform="translate(24, 0)">
    <circle cx="0" cy="22" r="4" fill="#10B981" class="node-pulse"/>
    <circle cx="0" cy="22" r="8" fill="#10B981" opacity="0.2" class="node-pulse"/>
    <text x="14" y="26" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#34D399" letter-spacing="1">SYSTEMS OPERATIONAL</text>
  </g>

  <!-- Center: Engineering Focus -->
  <text x="470" y="26" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#94A3B8" text-anchor="middle" letter-spacing="1">
    FULL-STACK ARCHITECTURE <tspan fill="#00F0FF">•</tspan> ZERO-DRIFT LEDGERS <tspan fill="#8B5CF6">•</tspan> HIGH-VELOCITY WEB
  </text>

  <!-- Right: Location / Local Time -->
  <g transform="translate(916, 0)">
    <text x="0" y="26" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#00F0FF" text-anchor="end" letter-spacing="1">
      INDIA // UTC+05:30
    </text>
  </g>
</svg>
