<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 75" width="100%" height="100%">
  <defs>
    <style>
      @keyframes floatChibi {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        25% { transform: translateY(-5px) rotate(-3deg); }
        50% { transform: translateY(0px) rotate(0deg); }
        75% { transform: translateY(-5px) rotate(3deg); }
      }
      @keyframes cursedEnergyPulse {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 0.9; }
      }
      .gojoFloat { transform-origin: 470px 45px; animation: floatChibi 1s ease-in-out infinite; }
      .yujiFloat { transform-origin: 410px 45px; animation: floatChibi 1s ease-in-out infinite 0.33s; }
      .megumiFloat { transform-origin: 530px 45px; animation: floatChibi 1s ease-in-out infinite 0.66s; }
      .energy { animation: cursedEnergyPulse 2s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Ground energy line -->
  <line x1="120" y1="62" x2="820" y2="62" stroke="#1E2436" stroke-width="1.5"/>
  <line x1="380" y1="62" x2="560" y2="62" stroke="#00F0FF" stroke-width="1.5" stroke-dasharray="4 6" class="energy"/>

  <!-- ================= CHIBI 1: YUJI ITADORI (Left) ================= -->
  <g class="yujiFloat" transform="translate(390, 14)">
    <!-- Dark Jujutsu Uniform with Red Hood -->
    <rect x="10" y="24" width="16" height="18" rx="4" fill="#0F172A"/>
    <!-- Red Hood -->
    <path d="M 8 23 Q 18 29 28 23 L 26 29 Q 18 33 10 29 Z" fill="#EF4444"/>
    <!-- Legs -->
    <rect x="11" y="42" width="5" height="7" fill="#020617"/>
    <rect x="20" y="42" width="5" height="7" fill="#020617"/>
    <!-- Red Shoes -->
    <rect x="9" y="48" width="7" height="3" rx="1" fill="#DC2626"/>
    <rect x="20" y="48" width="7" height="3" rx="1" fill="#DC2626"/>
    <!-- Head & Spiky Pink Hair -->
    <circle cx="18" cy="16" r="9.5" fill="#FED7AA"/>
    <path d="M 7 16 Q 18 4 29 16 Q 24 6 18 7 Q 12 6 7 16 Z" fill="#F472B6"/>
    <path d="M 9 17 Q 18 9 27 17 Z" fill="#020617"/>
    <!-- Eyes -->
    <circle cx="14" cy="17" r="1.5" fill="#78350F"/>
    <circle cx="22" cy="17" r="1.5" fill="#78350F"/>
    <!-- Sukuna eye slits under eyes -->
    <line x1="12" y1="20" x2="16" y2="20" stroke="#DC2626" stroke-width="0.8"/>
    <line x1="20" y1="20" x2="24" y2="20" stroke="#DC2626" stroke-width="0.8"/>
  </g>

  <!-- ================= CHIBI 2: SATORU GOJO (Center - The Strongest) ================= -->
  <g class="gojoFloat" transform="translate(450, 10)">
    <!-- Electric Blue Six Eyes Aura -->
    <ellipse cx="20" cy="24" rx="26" ry="24" fill="#00F0FF" opacity="0.15" class="energy"/>
    
    <!-- Dark Jujutsu High Teacher Uniform -->
    <rect x="10" y="26" width="20" height="20" rx="5" fill="#090D1A" stroke="#1E293B" stroke-width="0.8"/>
    <!-- High Collar -->
    <path d="M 12 26 L 16 32 L 24 32 L 28 26 Z" fill="#1E1B4B"/>
    <!-- Legs -->
    <rect x="12" y="46" width="6" height="8" fill="#050811"/>
    <rect x="22" y="46" width="6" height="8" fill="#050811"/>
    <!-- Shoes -->
    <rect x="10" y="52" width="8" height="3" rx="1" fill="#1E293B"/>
    <rect x="22" y="52" width="8" height="3" rx="1" fill="#1E293B"/>

    <!-- Hand Seal (🤞 Domain Expansion: Unlimited Void) -->
    <g transform="translate(26, 27)">
      <circle cx="5" cy="5" r="4" fill="#FED7AA"/>
      <!-- Crossed index and middle finger -->
      <line x1="5" y1="5" x2="5" y2="-2" stroke="#FED7AA" stroke-width="2" stroke-linecap="round"/>
      <line x1="7" y1="5" x2="4" y2="-3" stroke="#FED7AA" stroke-width="1.8" stroke-linecap="round"/>
      <!-- Blue Sparkle -->
      <circle cx="5" cy="-4" r="2.5" fill="#00F0FF"/>
      <circle cx="5" cy="-4" r="1" fill="#FFFFFF"/>
    </g>

    <!-- Head & Spiky Pure Snow White Hair -->
    <circle cx="20" cy="16" r="10.5" fill="#FCE7F3"/>
    <path d="M 6 16 Q 10 2 20 2 Q 30 2 34 16 Q 28 5 20 6 Q 12 5 6 16 Z" fill="#FFFFFF"/>
    <path d="M 9 14 Q 13 4 19 6 Q 16 10 12 14 Z" fill="#F1F5F9"/>
    <path d="M 31 14 Q 27 4 21 6 Q 24 10 28 14 Z" fill="#F1F5F9"/>

    <!-- Black Blindfold with Glowing Cyan Edges -->
    <rect x="9" y="14" width="22" height="7" rx="3" fill="#050811" stroke="#00F0FF" stroke-width="0.8"/>
    <!-- Glowing Six Eyes peeking out -->
    <circle cx="15" cy="17.5" r="1.5" fill="#00F0FF"/>
    <circle cx="15" cy="17.5" r="0.8" fill="#FFFFFF"/>
    <circle cx="25" cy="17.5" r="1.5" fill="#00F0FF"/>
    <circle cx="25" cy="17.5" r="0.8" fill="#FFFFFF"/>
    <!-- Confident Gojo Smirk -->
    <path d="M 17 23 Q 20 25 23 23" stroke="#DC2626" stroke-width="0.8" fill="none"/>
  </g>

  <!-- ================= CHIBI 3: MEGUMI FUSHIGURO (Right) ================= -->
  <g class="megumiFloat" transform="translate(520, 14)">
    <!-- Dark Jujutsu Uniform -->
    <rect x="10" y="24" width="16" height="18" rx="4" fill="#0B132B"/>
    <!-- Legs -->
    <rect x="11" y="42" width="5" height="7" fill="#020617"/>
    <rect x="20" y="42" width="5" height="7" fill="#020617"/>
    <!-- Head & Jet Black Spiky Sea Urchin Hair -->
    <circle cx="18" cy="16" r="9.5" fill="#FED7AA"/>
    <!-- Wild spikes -->
    <polygon points="18,3 13,10 23,10" fill="#0F172A"/>
    <polygon points="10,6 7,14 15,12" fill="#0F172A"/>
    <polygon points="26,6 21,12 29,14" fill="#0F172A"/>
    <polygon points="5,12 4,18 10,16" fill="#0F172A"/>
    <polygon points="31,12 26,16 32,18" fill="#0F172A"/>
    <!-- Green Emerald Eyes -->
    <circle cx="14" cy="17" r="1.5" fill="#10B981"/>
    <circle cx="22" cy="17" r="1.5" fill="#10B981"/>
    <!-- Hands forming Divine Dog shadow puppet -->
    <circle cx="18" cy="28" r="3" fill="#FED7AA"/>
  </g>
</svg>
