<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" width="420" height="300">
  <defs>
    <radialGradient id="radarFill" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#8B5CF6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.1"/>
    </radialGradient>
    <filter id="nodeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <style>
      @keyframes pulseVertex {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.4); opacity: 0.6; }
      }
      .node-pulse { transform-origin: center; animation: pulseVertex 2.5s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background Card -->
  <rect x="1" y="1" width="418" height="298" rx="20" fill="#070B16" stroke="#1E293B" stroke-width="1.2"/>
  
  <text x="24" y="32" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#00F0FF" letter-spacing="1.5">// ARCHITECTURAL RADAR</text>
  <text x="24" y="52" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="800" fill="#FFFFFF">Full-Stack Competency Matrix</text>

  <g transform="translate(210, 175)">
    <!-- Concentric Pentagon Grid Rings -->
    <!-- 100% Ring -->
    <polygon points="0,-95 90,-29 56,77 -56,77 -90,-29" fill="none" stroke="#1E293B" stroke-width="1"/>
    <!-- 75% Ring -->
    <polygon points="0,-71 67.5,-22 42,58 -42,58 -67.5,-22" fill="none" stroke="#1E293B" stroke-width="1" stroke-dasharray="3 3"/>
    <!-- 50% Ring -->
    <polygon points="0,-47.5 45,-14.5 28,38.5 -28,38.5 -45,-14.5" fill="none" stroke="#1E293B" stroke-width="1"/>
    <!-- 25% Ring -->
    <polygon points="0,-24 22.5,-7 14,19 -14,19 -22.5,-7" fill="none" stroke="#1E293B" stroke-width="1" stroke-dasharray="2 2"/>

    <!-- Axis Rays -->
    <line x1="0" y1="0" x2="0" y2="-95" stroke="#1E293B" stroke-width="1"/>
    <line x1="0" y1="0" x2="90" y2="-29" stroke="#1E293B" stroke-width="1"/>
    <line x1="0" y1="0" x2="56" y2="77" stroke="#1E293B" stroke-width="1"/>
    <line x1="0" y1="0" x2="-56" y2="77" stroke="#1E293B" stroke-width="1"/>
    <line x1="0" y1="0" x2="-90" y2="-29" stroke="#1E293B" stroke-width="1"/>

    <!-- Actual Competency Polygon (Mukesh's Real Mastery) -->
    <!-- Points calculated for 95%, 96%, 90%, 92%, 94% -->
    <polygon points="0,-90 86,-28 50,69 -51,71 -84,-27" fill="url(#radarFill)" stroke="#00F0FF" stroke-width="2"/>

    <!-- Vertex Points with Glow -->
    <circle cx="0" cy="-90" r="4.5" fill="#00F0FF" filter="url(#nodeGlow)"/>
    <circle cx="86" cy="-28" r="4.5" fill="#8B5CF6" filter="url(#nodeGlow)"/>
    <circle cx="50" cy="69" r="4.5" fill="#10B981" filter="url(#nodeGlow)"/>
    <circle cx="-51" cy="71" r="4.5" fill="#F43F5E" filter="url(#nodeGlow)"/>
    <circle cx="-84" cy="-27" r="4.5" fill="#38BDF8" filter="url(#nodeGlow)"/>

    <!-- Axis Labels -->
    <text x="0" y="-104" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#00F0FF" text-anchor="middle">FRONTEND (96%)</text>
    <text x="100" y="-26" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#8B5CF6" text-anchor="start">SYSTEMS (95%)</text>
    <text x="64" y="93" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#10B981" text-anchor="middle">DATABASE (90%)</text>
    <text x="-64" y="93" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#F43F5E" text-anchor="middle">SECURITY (92%)</text>
    <text x="-100" y="-26" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#38BDF8" text-anchor="end">APIs &amp; PERF (94%)</text>
  </g>
</svg>
