<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="voidBg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070D"/>
      <stop offset="50%" stop-color="#0B0E1B"/>
      <stop offset="100%" stop-color="#040509"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="jjkConnectBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#A855F7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Button Surface -->
    <linearGradient id="btnGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12182B"/>
      <stop offset="100%" stop-color="#0A0E1A"/>
    </linearGradient>

    <radialGradient id="voidSphere" cx="35%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#7C3AED" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Outer Frame -->
  <rect x="2" y="2" width="936" height="316" rx="26" fill="url(#voidBg4)" stroke="url(#jjkConnectBorder)" stroke-width="2"/>
  <rect x="2" y="2" width="936" height="316" rx="26" fill="url(#voidSphere)" pointer-events="none"/>

  <!-- ================= LEFT: GOJO UNLIMITED VOID ART ================= -->
  <g transform="translate(60, 40)">
    <!-- Rotating Infinity Cosmic Aura -->
    <circle cx="100" cy="115" r="85" fill="none" stroke="#00F0FF" stroke-width="1.2" stroke-dasharray="8 6" opacity="0.5"/>
    <circle cx="100" cy="115" r="70" fill="none" stroke="#A855F7" stroke-width="0.8" opacity="0.4"/>
    
    <!-- Stylized Gojo Domain Expansion Hand 🤞 with Starlight -->
    <g transform="translate(45, 50)">
      <!-- Cosmic Singularity Core -->
      <circle cx="55" cy="65" r="45" fill="#00F0FF" opacity="0.1"/>
      <circle cx="55" cy="65" r="32" fill="#A855F7" opacity="0.15"/>
      
      <!-- Crossed Fingers Silhouette with Electric Blue Glow -->
      <path d="M 45 95 L 55 55 L 62 45 L 68 55 L 62 95 Z" fill="#FED7AA"/>
      <!-- Index & Middle finger crossing -->
      <line x1="56" y1="55" x2="54" y2="28" stroke="#FED7AA" stroke-width="4.5" stroke-linecap="round"/>
      <line x1="62" y1="55" x2="52" y2="25" stroke="#FED7AA" stroke-width="4" stroke-linecap="round"/>
      
      <!-- Blue & Red Energy Swirls colliding -->
      <circle cx="53" cy="24" r="10" fill="#00F0FF" opacity="0.6"/>
      <circle cx="53" cy="24" r="5" fill="#FFFFFF"/>
      <circle cx="35" cy="35" r="5" fill="#00F0FF" opacity="0.8"/>
      <circle cx="70" cy="35" r="5" fill="#EF4444" opacity="0.8"/>
      
      <!-- White spiky hair silhouette peeking from top -->
      <polygon points="40,15 48,0 52,18" fill="#FFFFFF"/>
      <polygon points="52,14 58,-4 65,16" fill="#FFFFFF"/>
      <polygon points="32,20 38,5 44,22" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- ================= RIGHT: CONTACT & ACTION DECK ================= -->
  <g transform="translate(320, 36)">
    <!-- Header -->
    <text x="0" y="20" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#00F0FF" letter-spacing="3">// DOMAIN EXPANSION: UNLIMITED VOID</text>
    <text x="0" y="52" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">
      Let's build something impossible
    </text>
    <text x="0" y="74" font-family="'Inter', sans-serif" font-size="13" font-weight="400" fill="#94A3B8">
      Whether it's an impossible engineering feat or a high-velocity sprint, I am the strongest.
    </text>

    <!-- 4 Contact Pills (Grid: 2x2) -->
    <g transform="translate(0, 94)">
      
      <!-- GitHub Button -->
      <g transform="translate(0, 0)">
        <rect width="270" height="48" rx="12" fill="url(#btnGlass)" stroke="#1E2A4A" stroke-width="1.2"/>
        <circle cx="26" cy="24" r="14" fill="#FFFFFF" fill-opacity="0.1"/>
        <text x="26" y="29" font-family="'Inter', sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle">⌥</text>
        <text x="50" y="22" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">GitHub</text>
        <text x="50" y="36" font-family="'JetBrains Mono', monospace" font-size="10" fill="#00F0FF">@joshimukesh-15</text>
      </g>

      <!-- Email Button -->
      <g transform="translate(286, 0)">
        <rect width="270" height="48" rx="12" fill="url(#btnGlass)" stroke="#1E2A4A" stroke-width="1.2"/>
        <circle cx="26" cy="24" r="14" fill="#EF4444" fill-opacity="0.15"/>
        <text x="26" y="29" font-family="'Inter', sans-serif" font-size="14" fill="#EF4444" text-anchor="middle">✉</text>
        <text x="50" y="22" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Email Me</text>
        <text x="50" y="36" font-family="'JetBrains Mono', monospace" font-size="10" fill="#EF4444">joshimukesh2005@gmail.com</text>
      </g>

      <!-- Portfolio Button -->
      <g transform="translate(0, 58)">
        <rect width="270" height="48" rx="12" fill="url(#btnGlass)" stroke="#1E2A4A" stroke-width="1.2"/>
        <circle cx="26" cy="24" r="14" fill="#00F0FF" fill-opacity="0.15"/>
        <text x="26" y="29" font-family="'Inter', sans-serif" font-size="14" fill="#00F0FF" text-anchor="middle">🌐</text>
        <text x="50" y="22" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Interactive Portfolio</text>
        <text x="50" y="36" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94A3B8">MYPortfolio Live Demo</text>
      </g>

      <!-- LinkedIn Button -->
      <g transform="translate(286, 58)">
        <rect width="270" height="48" rx="12" fill="url(#btnGlass)" stroke="#1E2A4A" stroke-width="1.2"/>
        <circle cx="26" cy="24" r="14" fill="#0A66C2" fill-opacity="0.15"/>
        <text x="26" y="29" font-family="'Inter', sans-serif" font-size="14" fill="#60A5FA" text-anchor="middle">in</text>
        <text x="50" y="22" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">LinkedIn</text>
        <text x="50" y="36" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94A3B8">Connect / Mukesh Joshi</text>
      </g>

    </g>

    <!-- Bottom Status Line -->
    <g transform="translate(0, 222)">
      <circle cx="6" cy="6" r="4" fill="#00F0FF"/>
      <text x="18" y="10" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#F8FAFC">
        Open to freelance, collaborations, and Special Grade software engineering roles.
      </text>
    </g>

  </g>
</svg>
