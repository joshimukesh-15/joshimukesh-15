<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cardBg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E111A"/>
      <stop offset="50%" stop-color="#121624"/>
      <stop offset="100%" stop-color="#0B0D14"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4DEEEA" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#A855F7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FFE494" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Contact Button Hover Background -->
    <linearGradient id="btnBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A2033"/>
      <stop offset="100%" stop-color="#121625"/>
    </linearGradient>

    <radialGradient id="portalGlow" cx="30%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4DEEEA" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#7B2CBF" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Outer Card Frame -->
  <rect x="2" y="2" width="936" height="316" rx="26" fill="url(#cardBg4)" stroke="url(#borderGrad4)" stroke-width="2"/>
  <rect x="2" y="2" width="936" height="316" rx="26" fill="url(#portalGlow)" pointer-events="none"/>

  <!-- ================= LEFT: FRIEREN GRIMOIRE ART ================= -->
  <g transform="translate(60, 40)">
    <!-- Magic Circle behind book -->
    <circle cx="100" cy="115" r="85" fill="none" stroke="#4DEEEA" stroke-width="1" stroke-dasharray="6 4" opacity="0.4"/>
    <circle cx="100" cy="115" r="70" fill="none" stroke="#FFE494" stroke-width="0.8" opacity="0.3"/>
    
    <!-- Ancient Open Grimoire Book -->
    <g transform="translate(30, 60)">
      <!-- Book Cover & Spine -->
      <path d="M 70 85 L 10 95 L 10 20 L 70 10 Z" fill="#4C1D95" stroke="#7C3AED" stroke-width="1.5"/>
      <path d="M 70 85 L 130 95 L 130 20 L 70 10 Z" fill="#4C1D95" stroke="#7C3AED" stroke-width="1.5"/>
      <!-- Pages -->
      <path d="M 68 82 L 14 91 L 14 23 L 68 13 Z" fill="#FEF3C7"/>
      <path d="M 72 82 L 126 91 L 126 23 L 72 13 Z" fill="#FEF3C7"/>
      <!-- Runes on pages -->
      <line x1="22" y1="35" x2="60" y2="28" stroke="#D97706" stroke-width="1.2" stroke-linecap="round"/>
      <line x1="22" y1="46" x2="55" y2="40" stroke="#D97706" stroke-width="1.2" stroke-linecap="round"/>
      <line x1="22" y1="57" x2="58" y2="52" stroke="#D97706" stroke-width="1.2" stroke-linecap="round"/>
      <line x1="22" y1="68" x2="48" y2="64" stroke="#D97706" stroke-width="1.2" stroke-linecap="round"/>

      <line x1="80" y1="28" x2="118" y2="35" stroke="#D97706" stroke-width="1.2" stroke-linecap="round"/>
      <line x1="80" y1="40" x2="114" y2="46" stroke="#D97706" stroke-width="1.2" stroke-linecap="round"/>
      <line x1="80" y1="52" x2="118" y2="57" stroke="#D97706" stroke-width="1.2" stroke-linecap="round"/>
      <line x1="80" y1="64" x2="105" y2="68" stroke="#D97706" stroke-width="1.2" stroke-linecap="round"/>

      <!-- Glowing Starlight Rising from Grimoire -->
      <circle cx="70" cy="10" r="4" fill="#4DEEEA"/>
      <circle cx="55" cy="-8" r="2.5" fill="#FFE494"/>
      <circle cx="85" cy="-14" r="3" fill="#A855F7"/>
      <circle cx="70" cy="-28" r="3.5" fill="#FFFFFF"/>
    </g>

    <!-- Frieren Staff resting against Grimoire -->
    <line x1="165" y1="18" x2="45" y2="210" stroke="#FFE494" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="165" cy="18" r="10" fill="#4DEEEA" opacity="0.8"/>
    <circle cx="165" cy="18" r="4" fill="#FFFFFF"/>
  </g>

  <!-- ================= RIGHT: CONTACT & ACTION DECK ================= -->
  <g transform="translate(320, 36)">
    <!-- Header -->
    <text x="0" y="20" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#4DEEEA" letter-spacing="3">// JOIN THE PARTY</text>
    <text x="0" y="52" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">
      Let's venture to Ende together
    </text>
    <text x="0" y="74" font-family="'Inter', sans-serif" font-size="13" font-weight="400" fill="#9CA3AF">
      Whether it's an enduring full-stack quest or an agile sprint, my grimoire is open.
    </text>

    <!-- 4 Contact Pills (Grid: 2x2) -->
    <g transform="translate(0, 94)">
      
      <!-- GitHub Button -->
      <g transform="translate(0, 0)">
        <rect width="270" height="48" rx="12" fill="url(#btnBg)" stroke="#2B3349" stroke-width="1.2"/>
        <!-- Icon -->
        <circle cx="26" cy="24" r="14" fill="#FFFFFF" fill-opacity="0.1"/>
        <text x="26" y="29" font-family="'Inter', sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle">⌥</text>
        <text x="50" y="22" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">GitHub</text>
        <text x="50" y="36" font-family="'JetBrains Mono', monospace" font-size="10" fill="#8E95A8">@joshimukesh-15</text>
      </g>

      <!-- Email Button -->
      <g transform="translate(286, 0)">
        <rect width="270" height="48" rx="12" fill="url(#btnBg)" stroke="#2B3349" stroke-width="1.2"/>
        <!-- Icon -->
        <circle cx="26" cy="24" r="14" fill="#EF4444" fill-opacity="0.15"/>
        <text x="26" y="29" font-family="'Inter', sans-serif" font-size="14" fill="#EF4444" text-anchor="middle">✉</text>
        <text x="50" y="22" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Email Guild</text>
        <text x="50" y="36" font-family="'JetBrains Mono', monospace" font-size="10" fill="#8E95A8">joshimukesh2005@gmail.com</text>
      </g>

      <!-- Portfolio Button -->
      <g transform="translate(0, 58)">
        <rect width="270" height="48" rx="12" fill="url(#btnBg)" stroke="#2B3349" stroke-width="1.2"/>
        <!-- Icon -->
        <circle cx="26" cy="24" r="14" fill="#4DEEEA" fill-opacity="0.15"/>
        <text x="26" y="29" font-family="'Inter', sans-serif" font-size="14" fill="#4DEEEA" text-anchor="middle">🌐</text>
        <text x="50" y="22" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Interactive Portfolio</text>
        <text x="50" y="36" font-family="'JetBrains Mono', monospace" font-size="10" fill="#8E95A8">MYPortfolio Live Demo</text>
      </g>

      <!-- LinkedIn Button -->
      <g transform="translate(286, 58)">
        <rect width="270" height="48" rx="12" fill="url(#btnBg)" stroke="#2B3349" stroke-width="1.2"/>
        <!-- Icon -->
        <circle cx="26" cy="24" r="14" fill="#0A66C2" fill-opacity="0.15"/>
        <text x="26" y="29" font-family="'Inter', sans-serif" font-size="14" fill="#60A5FA" text-anchor="middle">in</text>
        <text x="50" y="22" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">LinkedIn</text>
        <text x="50" y="36" font-family="'JetBrains Mono', monospace" font-size="10" fill="#8E95A8">Connect / Mukesh Joshi</text>
      </g>

    </g>

    <!-- Bottom Status Line -->
    <g transform="translate(0, 222)">
      <circle cx="6" cy="6" r="4" fill="#10B981"/>
      <text x="18" y="10" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#E2E8F0">
        Open to freelance, contract collaborations, and full-time software engineering roles.
      </text>
    </g>

  </g>
</svg>
